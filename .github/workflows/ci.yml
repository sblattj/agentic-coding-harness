name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 18.x resolves to the newest 18.x release, which satisfies the
        # package.json engines floor of >=18.19.
        node-version: ['18.x', '20.x', '22.x']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Only the build needs Bun (bun build for dist/cli, dist/bun, dist/index.js).
      # It is installed after the test step on purpose: tests/*.test.ts already
      # detect Bun's presence at runtime (isBun) and take the Node+tsx fallback
      # path when it is absent, so running the suite before Bun exists on PATH
      # exercises that fallback the same way a Bun-less contributor machine
      # would, while the PTY suites that hard-require bun-pty skip themselves
      # cleanly with a "bun not on PATH" reason.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build
        run: npm run build

  python:
    name: python (3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # python/tests/test_cli.py imports `agentic_coding_harness` and drives
      # its console-script entry point (_cli.main) via a fake runtime forced
      # through AGENTIC_CODING_HARNESS_RUNTIME, so the package has to be
      # installed (not just present on disk) before pytest can collect it.
      # The vendored JS bundle the CLI wrapper execs
      # (src/agentic_coding_harness/_vendor/ach.mjs) is committed to the repo,
      # so no npm/bun build is needed to satisfy these tests.
      - name: Install package + pytest
        run: pip install -e . pytest

      - name: Test
        run: pytest -v
