<!doctype html>
<!--
  Observability Trio — detail view for ONE run (Concept A).
  Three synchronized panes (Traces | Metrics | Logs) + a FEED | LIVE TERMINAL
  drawer. Reads ?run=<runId>&token=<token>; all data from same-origin /api/*
  endpoints; the feed is the shared structured feed (/feed.js) over the run's
  /ws socket, the live terminal an xterm.js pane over /ws/pty/<id>.
  No frameworks, no external requests.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>agentic-coding-harness · observability trio</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/vendor/xterm/xterm.css">
<style>
* { box-sizing: border-box; margin: 0; }
:root {
  --bg: #0a0d14; --panel: #0e1219; --panel2: #141a26;
  --line: #1d2433; --line2: #2b3549;
  --fg: #dce3f2; --dim: #8a94ac; --faint: #5a6478;
  --cyan: #67d5f5; --teal: #5eead4; --blue: #7aa2f7;
  --purple: #bb9af7; --green: #a5d97a; --amber: #e6c07b; --red: #ff7590;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
}
html { scroll-behavior: auto; }
body {
  height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  background: radial-gradient(1100px 500px at 30% -10%, #101728 0%, var(--bg) 55%);
  color: var(--fg); font: 13px/1.45 var(--sans);
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
:focus-visible { outline: 1px solid var(--cyan); outline-offset: 2px; border-radius: 4px; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }

/* ===== header ===== */
header {
  display: flex; align-items: center; gap: 12px; min-height: 46px;
  padding: 6px 14px; flex: none;
  background: color-mix(in oklab, var(--panel) 88%, transparent);
  border-bottom: 1px solid var(--line); backdrop-filter: blur(6px);
}
.mark { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.mark small { color: var(--faint); font-weight: 500; font-size: 11px; letter-spacing: .08em; }
.back {
  display: flex; align-items: center; gap: 5px;
  font: 600 11px var(--mono); letter-spacing: .06em;
  color: var(--cyan); text-decoration: none; padding: 3px 9px;
  border: 1px solid var(--line2); border-radius: 6px; white-space: nowrap;
  transition: border-color .15s, background .15s;
}
.back:hover { border-color: var(--cyan); background: color-mix(in oklab, var(--cyan) 10%, transparent); }
.pagenav { display: flex; gap: 2px; white-space: nowrap; }
.pagenav a {
  color: var(--dim); text-decoration: none; font: 600 11px var(--mono); letter-spacing: .06em;
  padding: 3px 9px; border: 1px solid transparent; border-radius: 6px;
}
.pagenav a:hover { color: var(--fg); border-color: var(--line2); }
.pagenav a.active { color: var(--cyan); border-color: var(--line2); }
.runmeta { display: flex; align-items: center; gap: 8px; min-width: 0; font: 12px var(--mono); }
.runmeta b { font-weight: 600; }
.rid { color: var(--faint); }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.st-running { background: var(--green); }
.st-success { background: var(--teal); }
.st-error { background: var(--red); }
.st-aborted, .st-interrupted { background: var(--amber); }
.st-unknown { background: var(--faint); }
.stlabel { color: var(--dim); font-size: 11px; }
.pulse { display: flex; align-items: center; gap: 7px; margin-left: auto; font: 11.5px var(--mono); color: var(--dim); white-space: nowrap; }
.pulse i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.pulse.on { color: var(--green); }
.pulse.on i { background: var(--green); animation: ping 1.6s ease-out infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(165, 217, 122, .55); } 70%, 100% { box-shadow: 0 0 0 6px rgba(165, 217, 122, 0); } }
.tcost { display: flex; align-items: baseline; gap: 8px; font: 11px var(--mono); color: var(--faint); white-space: nowrap; }
.tcost b { font: 600 13px var(--mono); color: var(--amber); font-variant-numeric: tabular-nums; }

/* ===== fatal / empty states ===== */
#fatal[hidden] { display: none; }
#fatal {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 10px; text-align: center; padding: 20px;
}
#fatal h1 { font: 600 15px var(--sans); color: var(--fg); }
#fatal p { color: var(--dim); font: 12px var(--mono); max-width: 46ch; word-break: break-all; }
#fatal a { color: var(--cyan); }

/* ===== three panes ===== */
main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.04fr 1.3fr 1.04fr; gap: 10px; padding: 10px; }
.panel {
  display: flex; flex-direction: column; min-height: 0;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  overflow: hidden; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .02);
}
.ph {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px; flex: none;
  border-bottom: 1px solid var(--line);
  font-size: 10.5px; letter-spacing: .14em; color: var(--dim); text-transform: uppercase;
}
.pmeta {
  font: 11px var(--mono); letter-spacing: 0; text-transform: none;
  color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pempty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--faint); font: 11.5px var(--mono); }
.pb { flex: 1; min-height: 0; overflow: auto; padding: 7px; }

/* — traces — */
.span {
  display: grid; grid-template-columns: minmax(0, 46%) 1fr; align-items: center;
  height: 23px; cursor: pointer; border-radius: 5px;
}
.span:hover { background: var(--panel2); }
.span.sel { background: color-mix(in oklab, var(--cyan) 7%, transparent); }
.span.sel .lbl { color: var(--cyan); }
.span.sel .bar i { box-shadow: 0 0 0 1px var(--cyan), 0 0 10px rgba(103, 213, 245, .4); }
.lbl {
  display: flex; align-items: center; gap: 6px;
  font: 11.5px var(--mono); color: var(--dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.lbl em { font-style: normal; color: var(--faint); font-size: 10.5px; }
.lbl em.err { color: var(--red); }
.kd { width: 6px; height: 6px; border-radius: 2px; flex: none; }
.k-model .kd { background: var(--blue); }
.k-tool .kd { background: var(--teal); }
.k-sys .kd { background: var(--purple); }
.k-test .kd { background: var(--green); }
.bar { position: relative; height: 11px; background-image: linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 25% 100%; background-position: 0 center; }
.bar i { position: absolute; top: 1px; height: 9px; border-radius: 2px; min-width: 2px; }
.k-model .bar i { background: var(--blue); }
.k-tool .bar i { background: var(--teal); }
.k-sys .bar i { background: color-mix(in oklab, var(--purple) 75%, transparent); }
.k-test .bar i { background: var(--green); }
.bar i.err { background: var(--red); }

/* — metrics — */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px 10px 0; flex: none; }
.stat { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
.stat .k { font-size: 9.5px; letter-spacing: .12em; color: var(--faint); text-transform: uppercase; }
.stat .v { font: 600 15px var(--mono); margin-top: 2px; font-variant-numeric: tabular-nums; }
.v.c-in { color: var(--blue); } .v.c-out { color: var(--purple); }
.v.c-cr, .v.c-cw { color: var(--teal); }
.v.c-cost { color: var(--amber); } .v.c-el { color: var(--fg); }
.chartwrap { flex: 1; min-height: 0; display: grid; grid-template-rows: 1fr auto auto; padding: 8px 10px 10px; gap: 4px; }
.chartbox { position: relative; min-height: 0; }
#chart { width: 100%; height: 100%; display: block; }
#chart .grid { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
#chart .band { fill: rgba(103, 213, 245, .08); stroke: rgba(103, 213, 245, .35); stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
#chart .l-t { fill: none; stroke: var(--teal); stroke-width: 1.6; vector-effect: non-scaling-stroke; stroke-dasharray: 1600; stroke-dashoffset: 1600; animation: draw .9s cubic-bezier(.3, 0, .2, 1) forwards; }
#chart .l-u { fill: none; stroke: var(--amber); stroke-width: 1.3; vector-effect: non-scaling-stroke; stroke-dasharray: 5 4; }
@keyframes draw { to { stroke-dashoffset: 0; } }
#chart .xh { display: none; }
#chart .xh line { stroke: var(--faint); stroke-width: 1; vector-effect: non-scaling-stroke; }
#chart .ct { fill: var(--teal); } #chart .cu { fill: var(--amber); }
.axl { position: absolute; right: calc(100% + 6px); font: 9.5px var(--mono); color: var(--faint); transform: translateY(-50%); }
.tip {
  position: absolute; top: 6px; left: 0; pointer-events: none; display: none;
  background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px;
  padding: 3px 8px; font: 10.5px var(--mono); color: var(--fg);
  white-space: nowrap; box-shadow: 0 4px 14px rgba(0, 0, 0, .4);
}
.axt { display: flex; justify-content: space-between; font: 9.5px var(--mono); color: var(--faint); }
.legend { display: flex; gap: 14px; justify-content: flex-end; font: 10px var(--mono); color: var(--dim); }
.sw { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
.sw-t { background: var(--teal); } .sw-u { background: var(--amber); }

/* — logs — */
.fchip {
  font: 10.5px var(--mono); letter-spacing: 0; text-transform: none; color: var(--cyan);
  border: 1px solid color-mix(in oklab, var(--cyan) 40%, var(--line));
  border-radius: 5px; padding: 1px 7px; max-width: 40%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: none;
}
.fchip:hover { background: color-mix(in oklab, var(--cyan) 12%, transparent); }
.logs .pmeta { margin-left: 0; }
.log { display: flex; gap: 9px; padding: 1.5px 6px; font: 11.5px var(--mono); line-height: 1.55; }
.log:hover { background: var(--panel2); }
.log .ts { color: var(--faint); flex: none; width: 62px; }
.lv { flex: none; width: 40px; font-weight: 700; font-size: 10px; letter-spacing: .06em; padding-top: 1px; }
.lv-info { color: var(--teal); } .lv-warn { color: var(--amber); }
.lv-error { color: var(--red); } .lv-usage { color: var(--faint); }
.log .sp { flex: none; max-width: 38%; overflow: hidden; text-overflow: ellipsis; color: var(--dim); white-space: nowrap; }
.log .sp.hit { color: var(--cyan); }
.log .m { color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ===== terminal drawer ===== */
footer { flex: none; height: 320px; display: flex; flex-direction: column; background: #0b0f16; border-top: 1px solid var(--line); transition: height .2s ease; }
footer.min { height: 35px; }
footer.live { height: min(74vh, 760px); }          /* live mode: big workspace, not a replay strip */
footer.live.max { height: calc(100vh - 48px); }    /* near-full-screen */
.tbar {
  display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; flex: none;
  border-bottom: 1px solid var(--line);
  font-size: 10.5px; letter-spacing: .14em; color: var(--dim); text-transform: uppercase;
}
#drawerToggle { color: var(--dim); font-size: 13px; line-height: 1; transition: transform .2s; }
footer.min #drawerToggle { transform: rotate(180deg); }
footer.min .tbody { display: none; }
.tbody { flex: 1; min-height: 0; overflow: auto; position: relative; }
#feedBox {
  position: absolute; inset: 0; overflow: auto;
  /* page theme -> feed theme (see /feed.js) */
  --feed-bg: #0b0f16;
  --feed-fg: var(--fg);
  --feed-dim: var(--faint);
  --feed-line: var(--line);
  --feed-green: var(--green);
  --feed-red: var(--red);
  --feed-yellow: var(--amber);
  --feed-blue: var(--blue);
  --feed-mono: var(--mono);
}
#liveBox { position: absolute; inset: 0; padding: 8px 10px; overflow: hidden; }
.player-msg { color: var(--dim); font: 11.5px var(--mono); padding: 8px 2px; }
.term-err { color: var(--red); opacity: .75; font: 11.5px var(--mono); padding: 8px 2px; }
.term-err small { display: block; color: var(--dim); padding-top: 4px; }

/* — mode toggle: feed | live terminal — */
.tmode { display: flex; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; flex: none; }
.mtog {
  padding: 2px 10px; font: 600 10px var(--mono); letter-spacing: .08em; text-transform: uppercase;
  color: var(--dim); transition: color .15s, background .15s;
}
.mtog + .mtog { border-left: 1px solid var(--line2); }
.mtog:hover { color: var(--fg); background: var(--panel2); }
.mtog.on { color: var(--cyan); background: color-mix(in oklab, var(--cyan) 12%, transparent); }
.mtog:disabled { opacity: .4; cursor: default; }
.tright { margin-left: auto; display: flex; align-items: center; gap: 4px; }
#termSize { color: var(--dim); font-size: 14px; line-height: 1; padding: 0 4px; }
#termSize:hover { color: var(--cyan); }

/* ---- inlined term-pane component styles (class-prefixed "tp-", from term-pane.html).
        Colors fall back to this page's palette vars (--panel/--green/...). ------ */
.term-pane {
  --tp-panel:  var(--panel,  #0e1219);
  --tp-panel2: var(--panel2, #141a26);
  --tp-line:   var(--line,   #1d2433);
  --tp-text:   var(--fg,     #dce3f2);
  --tp-dim:    var(--dim,    #8a94ac);
  --tp-green:  var(--green,  #a5d97a);
  --tp-red:    var(--red,    #ff7590);
  --tp-amber:  var(--amber,  #e6c07b);
  --tp-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;

  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;                 /* lets the xterm body shrink inside flex hosts */
  background: var(--tp-panel);
  border: 1px solid var(--tp-line);
  border-radius: 8px;
  overflow: hidden;
  font: 12px/1.4 var(--tp-mono);
  color: var(--tp-text);
}
.term-pane .tp-bar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 10px;
  background: var(--tp-panel2);
  border-bottom: 1px solid var(--tp-line);
  font: 600 10.5px var(--tp-mono);
  letter-spacing: .06em;
  user-select: none;
}
.term-pane .tp-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--tp-dim);
  flex: none;
}
.term-pane .tp-dot.live {
  background: var(--tp-green);
  box-shadow: 0 0 8px var(--tp-green);
  animation: tp-pulse 1.6s ease-out infinite;
}
.term-pane .tp-dot.reconn { background: var(--tp-amber); box-shadow: 0 0 8px var(--tp-amber); }
.term-pane .tp-dot.dead  { background: var(--tp-red);   box-shadow: 0 0 8px var(--tp-red); }
.term-pane .tp-title {
  color: var(--tp-green);
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.term-pane .tp-stat { margin-left: auto; color: var(--tp-dim); font-weight: 400; white-space: nowrap; }
.term-pane .tp-stat.exited { color: var(--tp-red); }
.term-pane .tp-stat.reconn { color: var(--tp-amber); }
@keyframes tp-pulse {
  0%   { box-shadow: 0 0 0 0 rgba(255,255,255,.25), 0 0 8px var(--tp-green); }
  70%  { box-shadow: 0 0 0 6px transparent, 0 0 8px var(--tp-green); }
  100% { box-shadow: 0 0 0 0 transparent, 0 0 8px var(--tp-green); }
}
.term-pane .tp-body {
  flex: 1;
  min-height: 0;
  padding: 4px 2px 2px 6px;
  background: var(--tp-panel);
}
.term-pane .tp-body .terminal { padding: 0; }   /* our own padding instead of xterm's */
@media (prefers-reduced-motion: reduce) {
  .term-pane .tp-dot.live { animation: none; }
}

/* ===== responsive + motion ===== */
@media (max-width: 1080px) {
  body { height: auto; overflow: auto; }
  main { grid-template-columns: 1fr; }
  .panel { min-height: 300px; }
  header { flex-wrap: wrap; }
  .pulse { margin-left: 0; }
  footer, footer.min { height: 260px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
  #chart .l-t { stroke-dasharray: none; stroke-dashoffset: 0; }
}
</style>
</head>
<body>

<header>
  <div class="mark">
    <svg width="17" height="17" viewBox="0 0 17 17" aria-hidden="true"><rect x="1" y="6" width="3" height="10" rx="1" fill="#bb9af7"/><rect x="7" y="1" width="3" height="15" rx="1" fill="#5eead4"/><rect x="13" y="9" width="3" height="7" rx="1" fill="#7aa2f7"/></svg>
    agentic-coding-harness <small>OBSERVABILITY TRIO</small>
  </div>
  <a class="back" id="backBtn" href="/grid" aria-label="back to run grid">&larr; grid</a>
  <nav class="pagenav" aria-label="pages">
    <a data-nav="grid" href="/grid">grid</a>
    <a data-nav="compare" href="/compare">compare</a>
    <a data-nav="observability" class="active" href="/trio">observability</a>
  </nav>
  <div class="runmeta" id="runmeta"></div>
  <div class="pulse" id="pulse"><i></i><span id="pulseTxt">&hellip;</span></div>
  <div class="tcost"><span>&Sigma; cost</span><b id="totalCost">&ndash;</b></div>
</header>

<div id="fatal" hidden></div>

<main id="main" hidden>
  <section class="panel" aria-label="traces">
    <div class="ph"><span>Traces</span><span class="pmeta" id="traceMeta"></span></div>
    <div class="pb" id="traceList"></div>
  </section>
  <section class="panel" aria-label="metrics">
    <div class="ph"><span>Metrics</span><span class="pmeta" id="chartMeta"></span></div>
    <div class="stats" id="stats"></div>
    <div class="chartwrap">
      <div class="chartbox" id="chartbox">
        <span class="axl" id="ax2" style="top:100%">0</span>
        <span class="axl" id="ax1" style="top:50%"></span>
        <span class="axl" id="ax0" style="top:0"></span>
        <svg id="chart" viewBox="0 0 640 176" preserveAspectRatio="none" role="img" aria-label="cumulative tokens and cost over the run"></svg>
        <div class="tip" id="tip"></div>
      </div>
      <div class="axt" id="axT"></div>
      <div class="legend"><span><i class="sw sw-t"></i>tokens</span><span><i class="sw sw-u"></i>cost</span></div>
    </div>
  </section>
  <section class="panel logs" aria-label="logs">
    <div class="ph"><span>Logs</span><button class="fchip" id="logFilter" hidden></button><span class="pmeta" id="logMeta"></span></div>
    <div class="pb" id="logList"></div>
  </section>
</main>

<footer id="drawer">
  <div class="tbar">
    <span class="tmode" role="group" aria-label="drawer mode">
      <button type="button" class="mtog on" id="modeFeed" aria-pressed="true">feed</button><button type="button" class="mtog" id="modeLive" aria-pressed="false">live terminal</button>
    </span>
    <span class="pmeta" id="termMeta"></span>
    <span class="tright">
      <button type="button" id="termSize" hidden aria-label="expand terminal to near full screen" title="near full screen">&#10530;</button>
      <button type="button" id="drawerToggle" aria-expanded="true" aria-label="collapse drawer">&#9662;</button>
    </span>
  </div>
  <div class="tbody">
    <div id="feedBox"></div>
    <div id="liveBox" hidden></div>
  </div>
</footer>

<script src="/feed.js"></script>
<script>
(function () {
"use strict";

/* ===== helpers ===== */
function $(id) { return document.getElementById(id); }
function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function K(n) {
  n = Number(n) || 0;
  if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
  return String(Math.round(n));
}
function USD(n) { return "$" + (Number(n) || 0).toFixed(3); }
function S(ms) { return ((ms || 0) / 1000).toFixed(1) + "s"; }
function fmtDurMs(ms) {
  ms = Number(ms) || 0;
  return ms < 1000 ? Math.round(ms) + "ms" : (ms / 1000).toFixed(ms < 10000 ? 2 : 1) + "s";
}

/* ===== query params ===== */
var QS = new URLSearchParams(location.search);
var RUN_ID = QS.get("run") || "";
var TOKEN = QS.get("token") || "";
var BACK_HREF = "/grid" + (TOKEN ? "?token=" + encodeURIComponent(TOKEN) : "");
$("backBtn").href = BACK_HREF;
(function () {
  var qs = TOKEN ? "?token=" + encodeURIComponent(TOKEN) : "";
  var links = document.querySelectorAll(".pagenav a");
  for (var i = 0; i < links.length; i++) links[i].href += qs;
})();
var LIVE_WINDOW_MS = 60000; // matches server NOT_LIVE_AFTER_MS

/* ===== state ===== */
var obs = null;   // /observability payload
var rec = null;   // matching RunRecord from /api/runs (may be null)
var sel = null;   // selected span: {id, name, startMs, endMs}
var pollTimer = null;
var feedOpened = false;
var feed = null;       // HarnessFeed handle
var feedConn = null;   // HarnessFeed.connect() handle
var feedEnded = false; // the run's stream reported `end` (terminal)
var chartPts = null; // display points for the crosshair

function api(path) { return fetch(path).then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r; }); }

/* ===== header ===== */
function isLive() {
  if (rec && rec.source === "external") return rec.endedAt == null;
  return !!rec && rec.status === "running" && Date.now() - (rec.updatedAt || 0) < LIVE_WINDOW_MS;
}
function renderHeader() {
  var box = $("runmeta");
  box.textContent = "";
  var status = rec ? rec.status : "unknown";
  box.appendChild(el("span", "dot st-" + status));
  box.appendChild(el("b", null, rec && rec.agent ? rec.agent : (RUN_ID ? "run" : "no run")));
  var rid = el("span", "rid", RUN_ID);
  rid.title = RUN_ID;
  box.appendChild(rid);
  box.appendChild(el("span", "stlabel", status));
  var pulse = $("pulse");
  var live = isLive();
  var external = !!(rec && rec.source === "external");
  $("modeLive").disabled = external;
  $("modeLive").title = external ? "external run — no local terminal" : "";
  pulse.classList.toggle("on", live);
  if (live) {
    var end = Date.now();
    var dur = Math.max(0, end - (rec.startedAt || end));
    $("pulseTxt").textContent = "LIVE \u00b7 " + S(dur);
  } else {
    $("pulseTxt").textContent = status.toUpperCase();
  }
  $("totalCost").textContent = obs ? USD(obs.totalCostUsd) : "\u2013";
}

/* ===== fatal states ===== */
function fatal(title, detail, link) {
  $("main").hidden = true;
  var f = $("fatal");
  f.hidden = false;
  f.textContent = "";
  f.appendChild(el("h1", null, title));
  if (detail) f.appendChild(el("p", null, detail));
  if (link) {
    var a = el("a", null, "\u2190 back to grid");
    a.href = BACK_HREF;
    f.appendChild(a);
  }
}

/* ===== timeline bounds ===== */
function totalMs() {
  if (!obs) return 1;
  var t = obs.durationMs || 0;
  (obs.spans || []).forEach(function (s) { t = Math.max(t, s.startMs + s.durationMs); });
  (obs.metrics || []).forEach(function (m) { t = Math.max(t, m.tMs); });
  (obs.logs || []).forEach(function (l) { t = Math.max(t, l.tMs); });
  return Math.max(t, 1);
}

/* ===== traces pane ===== */
function sortedSpans() {
  return (obs && obs.spans ? obs.spans : []).slice().sort(function (a, b) {
    return a.startMs - b.startMs || a.depth - b.depth;
  });
}
function renderTraces() {
  var box = $("traceList");
  box.textContent = "";
  var spans = sortedSpans();
  $("traceMeta").textContent = spans.length + " spans \u00b7 " + S(totalMs());
  if (!spans.length) { box.appendChild(el("div", "pempty", "no spans")); return; }
  var T = totalMs();
  spans.forEach(function (s) {
    var row = el("div", "span k-" + s.kind + (sel && sel.id === s.id ? " sel" : ""));
    row.setAttribute("role", "button");
    row.setAttribute("tabindex", "0");
    row.setAttribute("aria-pressed", sel && sel.id === s.id ? "true" : "false");
    row.dataset.id = s.id;
    var usageBits = [];
    if (s.usage) {
      usageBits.push("in " + K(s.usage.inputTokens), "out " + K(s.usage.outputTokens),
        "cacheRead " + K(s.usage.cacheReadTokens), "cacheWrite " + K(s.usage.cacheWriteTokens));
    }
    row.title = s.name + " \u00b7 " + fmtDurMs(s.durationMs) + (usageBits.length ? " \u00b7 " + usageBits.join(" \u00b7 ") : "");

    var lbl = el("span", "lbl");
    lbl.style.paddingLeft = ((s.depth || 0) * 13) + "px";
    lbl.appendChild(el("i", "kd"));
    lbl.appendChild(document.createTextNode(s.name + " "));
    lbl.appendChild(el("em", s.isError ? "err" : null, fmtDurMs(s.durationMs)));
    row.appendChild(lbl);

    var bar = el("span", "bar");
    var fill = el("i", s.isError ? "err" : null);
    fill.style.left = (s.startMs / T * 100).toFixed(2) + "%";
    fill.style.width = Math.max(s.durationMs / T * 100, 0.4).toFixed(2) + "%";
    bar.appendChild(fill);
    row.appendChild(bar);
    box.appendChild(row);
  });
}

/* ===== metrics pane ===== */
function displayPoints() {
  // cumulative series padded with (t=0, zeros) and a carry to run end so
  // the step chart spans the full width even when usage stops early.
  var ms = obs && obs.metrics ? obs.metrics.slice() : [];
  if (!ms.length) return [];
  var pts = [{ tMs: 0, input: 0, output: 0, cacheRead: 0, cacheWrite: 0, costUsd: 0 }];
  ms.forEach(function (m) { pts.push(m); });
  var last = ms[ms.length - 1];
  var T = totalMs();
  if (last.tMs < T) pts.push({ tMs: T, input: last.input, output: last.output, cacheRead: last.cacheRead, cacheWrite: last.cacheWrite, costUsd: last.costUsd });
  return pts;
}
function tokOf(p) { return (p.input || 0) + (p.output || 0) + (p.cacheRead || 0) + (p.cacheWrite || 0); }

var CW = 640, CH = 176;
function stepPoints(pts, val, maxV) {
  var out = "";
  var prevY = null;
  for (var i = 0; i < pts.length; i++) {
    var x = (pts[i].tMs / totalMs() * CW).toFixed(1);
    var y = (CH - 4 - val(pts[i]) / maxV * (CH - 16)).toFixed(1);
    if (i === 0) out = x + "," + y; // vertical from baseline is drawn by the first point itself
    else out += " " + x + "," + prevY + " " + x + "," + y; // step-after: across, then up
    prevY = y;
  }
  return out;
}
function drawChart() {
  var svg = $("chart");
  var tip = $("tip");
  tip.style.display = "none";
  var pts = displayPoints();
  if (pts.length < 2) {
    svg.textContent = "";
    chartPts = null;
    $("ax0").textContent = ""; $("ax1").textContent = ""; $("ax2").textContent = "0";
    $("axT").textContent = "";
    var box = $("chartbox");
    if (!$("chartEmpty")) {
      var msg = el("div", "pempty", "no usage recorded");
      msg.id = "chartEmpty";
      msg.style.position = "absolute";
      msg.style.inset = "0";
      box.appendChild(msg);
    }
    return;
  }
  var emptyMsg = $("chartEmpty");
  if (emptyMsg) emptyMsg.remove();

  var T = totalMs();
  var maxTok = 0, maxCost = 0;
  pts.forEach(function (p) { maxTok = Math.max(maxTok, tokOf(p)); maxCost = Math.max(maxCost, p.costUsd || 0); });
  maxTok = maxTok * 1.15 || 1;
  maxCost = maxCost * 1.15 || 1;
  chartPts = { pts: pts, maxTok: maxTok, maxCost: maxCost, T: T };

  var inner = "";
  for (var g = 1; g < 4; g++) {
    var gy = (CH - 4 - (CH - 16) * g / 4).toFixed(1);
    inner += '<line class="grid" x1="0" x2="' + CW + '" y1="' + gy + '" y2="' + gy + '"/>';
  }
  if (sel) {
    var bx = (sel.startMs / T * CW).toFixed(1);
    var bw = Math.max((sel.endMs - sel.startMs) / T * CW, 2).toFixed(1);
    inner += '<rect class="band" x="' + bx + '" y="0" width="' + bw + '" height="' + CH + '"/>';
  }
  inner += '<polyline class="l-t" points="' + stepPoints(pts, tokOf, maxTok) + '"/>';
  inner += '<polyline class="l-u" points="' + stepPoints(pts, function (p) { return p.costUsd || 0; }, maxCost) + '"/>';
  inner += '<g class="xh"><line x1="0" x2="0" y1="0" y2="' + CH + '"/><circle class="ct" r="3.2"/><circle class="cu" r="3.2"/></g>';
  svg.innerHTML = inner;

  $("ax0").textContent = K(maxTok);
  $("ax1").textContent = K(maxTok / 2);
  $("axT").textContent = "";
  $("axT").appendChild(el("span", null, "0s"));
  $("axT").appendChild(el("span", null, S(T / 2)));
  $("axT").appendChild(el("span", null, S(T)));
}
function renderMetrics() {
  var last = obs && obs.metrics && obs.metrics.length ? obs.metrics[obs.metrics.length - 1] : null;
  var cards = [
    ["input", last ? K(last.input) : "\u2013", "c-in"],
    ["output", last ? K(last.output) : "\u2013", "c-out"],
    ["cache read", last ? K(last.cacheRead) : "\u2013", "c-cr"],
    ["cache write", last ? K(last.cacheWrite) : "\u2013", "c-cw"],
    ["cost", obs ? USD(obs.totalCostUsd) : "\u2013", "c-cost"],
    ["duration", obs ? S(obs.durationMs) : "\u2013", "c-el"],
  ];
  var box = $("stats");
  box.textContent = "";
  cards.forEach(function (c) {
    var d = el("div", "stat");
    d.appendChild(el("div", "k", c[0]));
    d.appendChild(el("div", "v " + c[2], c[1]));
    box.appendChild(d);
  });
  var nPts = obs && obs.metrics ? obs.metrics.length : 0;
  $("chartMeta").textContent = nPts ? nPts + " usage points" : "";
  drawChart();
}

/* crosshair */
function chartMove(e) {
  if (!chartPts) return;
  var r = $("chart").getBoundingClientRect();
  var fx = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  var t = fx * chartPts.T;
  var pts = chartPts.pts;
  var i = 0;
  while (i + 1 < pts.length && pts[i + 1].tMs <= t) i++;
  var p = pts[i];
  var xh = $("chart").querySelector(".xh");
  if (!xh) return;
  var xx = (p.tMs / chartPts.T * CW).toFixed(1);
  var yt = (CH - 4 - tokOf(p) / chartPts.maxTok * (CH - 16)).toFixed(1);
  var yu = (CH - 4 - (p.costUsd || 0) / chartPts.maxCost * (CH - 16)).toFixed(1);
  xh.style.display = "block";
  var ln = xh.querySelector("line");
  ln.setAttribute("x1", xx); ln.setAttribute("x2", xx);
  var ct = xh.querySelector(".ct"), cu = xh.querySelector(".cu");
  ct.setAttribute("cx", xx); ct.setAttribute("cy", yt);
  cu.setAttribute("cx", xx); cu.setAttribute("cy", yu);
  var tip = $("tip");
  tip.style.display = "block";
  tip.textContent = "+" + S(p.tMs) + " \u00b7 " + K(tokOf(p)) + " tok \u00b7 " + USD(p.costUsd || 0);
  tip.style.left = Math.min(76, Math.max(2, fx * 100)) + "%";
}
function chartLeave() {
  var xh = $("chart").querySelector(".xh");
  if (xh) xh.style.display = "none";
  $("tip").style.display = "none";
}

/* ===== logs pane ===== */
function logRow(l, hit) {
  var d = el("div", "log");
  d.appendChild(el("span", "ts", "+" + ((l.tMs || 0) / 1000).toFixed(3) + "s"));
  d.appendChild(el("span", "lv lv-" + l.level, l.level));
  var sp = el("span", "sp" + (hit ? " hit" : ""), l.span || "");
  sp.title = l.span || "";
  d.appendChild(sp);
  var m = el("span", "m", l.text || "");
  m.title = l.text || "";
  d.appendChild(m);
  return d;
}
function renderLogs() {
  var box = $("logList");
  var logs = obs && obs.logs ? obs.logs : [];
  var rows = sel ? logs.filter(function (l) { return l.span === sel.name; }) : logs;
  $("logMeta").textContent = rows.length + " / " + logs.length + " lines";
  var chip = $("logFilter");
  chip.hidden = !sel;
  if (sel) chip.textContent = "filter: " + sel.name + "  \u2715";
  chip.title = sel ? "clear span filter" : "";
  box.textContent = "";
  if (!rows.length) {
    box.appendChild(el("div", "pempty", sel ? "no lines for this span" : "no log lines"));
    return;
  }
  var frag = document.createDocumentFragment();
  rows.forEach(function (l) { frag.appendChild(logRow(l, !!sel && l.span === sel.name)); });
  box.appendChild(frag);
  box.scrollTop = box.scrollHeight;
}

/* ===== selection sync ===== */
function applySel() {
  renderTraces();
  renderLogs();
  drawChart();
}
function pickSpan(id) {
  var span = null;
  (obs && obs.spans ? obs.spans : []).forEach(function (s) { if (s.id === id) span = s; });
  if (!span) return;
  if (sel && sel.id === id) sel = null; // toggle off
  else sel = { id: span.id, name: span.name, startMs: span.startMs, endMs: span.startMs + span.durationMs };
  applySel();
}
function clearSel() {
  if (!sel) return;
  sel = null;
  applySel();
}

/* ===== terminal drawer ===== */
/* Two modes: "feed" (the shared structured HarnessFeed over the run's /ws
   socket — the primary content, default) and "live" (spawn a fresh interactive
   PTY for the run's agent and attach a full-size xterm.js pane — watch AND
   type). Live sessions are disposed+killed on drawer collapse, mode switch,
   spawn retry, and page unload. */

/* ---- inlined term-pane component (from src/web/term-pane.html). Requires the
        vendored xterm assets (/vendor/xterm/*), lazily loaded via ensureXterm().
        WS protocol: server->client raw PTY bytes (first frame = scrollback,
        {"type":"exit",exitCode:N} on exit); client->server raw keystrokes and
        {"type":"resize","cols":C,"rows":R} control frames. ---- */
function createTermPane(container, opts) {
  if (typeof Terminal === "undefined")
    throw new Error("term-pane: host page must load /vendor/xterm/xterm.js (+ xterm.css, addon-fit.js, addon-webgl.js) first");
  var opt = opts || {};
  var id = opt.id, token = opt.token, command = opt.command, live = opt.live !== false;
  if (!id) throw new Error("term-pane: opts.id is required");

  // ---- DOM: titlebar + terminal body ------------------------------------------------
  var pane = el("div", "term-pane");
  pane.innerHTML =
    '<div class="tp-bar">' +
      '<span class="tp-dot"></span>' +
      '<span class="tp-title"></span>' +
      '<span class="tp-stat"></span>' +
    '</div>' +
    '<div class="tp-body"></div>';
  var dotEl   = pane.querySelector(".tp-dot");
  var titleEl = pane.querySelector(".tp-title");
  var statEl  = pane.querySelector(".tp-stat");
  var bodyEl  = pane.querySelector(".tp-body");
  titleEl.textContent = command || id;
  container.appendChild(pane);

  // ---- terminal ---------------------------------------------------------------------
  var reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var term = new Terminal({
    convertEol: true,
    cursorBlink: !reducedMotion,
    scrollback: 5000,
    fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace',
    fontSize: 12,
    theme: {           // trio palette (xterm can't read CSS vars)
      background: "#0b0f16", foreground: "#dce3f2", cursor: "#67d5f5",
      cursorAccent: "#0b0f16", selectionBackground: "#67d5f544",
      black: "#0e1219", red: "#ff7590", green: "#a5d97a", yellow: "#e6c07b",
      blue: "#7aa2f7", magenta: "#bb9af7", cyan: "#67d5f5", white: "#dce3f2",
      brightBlack: "#8a94ac", brightWhite: "#ffffff",
    },
  });
  var fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(bodyEl);                 // open BEFORE WebGL, per xterm docs
  try { term.loadAddon(new WebglAddon.WebglAddon()); } catch (e) { /* DOM renderer fallback */ }
  fit.fit();
  term.focus();

  // ---- status -----------------------------------------------------------------------
  var dead = false;                  // process exited: no more input, no reconnect
  function setStatus(cls, text) {
    dotEl.className = "tp-dot" + (cls ? " " + cls : "");
    statEl.className = "tp-stat" + (cls === "dead" ? " exited" : cls === "reconn" ? " reconn" : "");
    statEl.textContent = text;
  }
  setStatus("", live ? "connecting\u2026" : "offline");

  // ---- websocket --------------------------------------------------------------------
  var sock = null, disposed = false, firstFrame = false;
  var retryMs = 500, retryTimer = 0;
  var lastCols = -1, lastRows = -1;

  function connect() {
    if (disposed || dead || !live) return;
    var proto = location.protocol === "https:" ? "wss:" : "ws:";
    var url = proto + "//" + location.host +
                "/ws/pty/" + encodeURIComponent(id) + "?token=" + encodeURIComponent(token);
    sock = new WebSocket(url);

    sock.onopen = function () {
      retryMs = 500;
      firstFrame = true;              // next frame is the scrollback resync
      setStatus("live", "live");
      lastCols = -1;                  // force-send size so the PTY matches the pane
      sendResize();
    };
    sock.onmessage = function (ev) {
      var data = ev.data;
      if (firstFrame) {               // server resends full scrollback on (re)connect
        term.reset();
        firstFrame = false;
      }
      var ctl = parseExitFrame(data);
      if (ctl) { onExit(ctl.exitCode); return; }
      term.write(data);               // raw PTY bytes, ANSI included — never escaped
    };
    sock.onclose = function () {
      if (disposed || dead || !live) return;
      setStatus("reconn", "reconnecting\u2026");
      retryTimer = setTimeout(connect, retryMs);   // backoff: 0.5s → 1 → 2 → … → 8s cap
      retryMs = Math.min(retryMs * 2, 8000);
    };
    sock.onerror = function () { /* close event follows and drives reconnect */ };
  }

  // A control frame is a whole-frame JSON object with type:"exit"; anything else
  // (including raw output that merely starts with '{') is written verbatim.
  function parseExitFrame(d) {
    if (typeof d !== "string" || d.length < 20 || d.charCodeAt(0) !== 0x7b /* '{' */) return null;
    try {
      var j = JSON.parse(d);
      return (j && j.type === "exit") ? j : null;
    } catch (e) { return null; }
  }

  function onExit(code) {
    dead = true;
    term.write("\r\n\x1b[2m[process exited " + (code == null ? "?" : code) + "]\x1b[22m\r\n"); // dim exit line
    setStatus("dead", "exited " + (code == null ? "?" : code));
    try { sock && sock.close(); } catch (e) {}
  }

  function sendResize() {
    if (!sock || sock.readyState !== 1 || dead) return;
    if (term.cols === lastCols && term.rows === lastRows) return;
    lastCols = term.cols; lastRows = term.rows;
    sock.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
  }

  // keystrokes → PTY, only while live, connected, and process alive
  term.onData(function (d) {
    if (live && !dead && sock && sock.readyState === 1) sock.send(d);
  });

  // ---- resize tracking ---------------------------------------------------------------
  var fitReq = 0;
  var ro = new ResizeObserver(function () {
    if (disposed) return;
    cancelAnimationFrame(fitReq);
    fitReq = requestAnimationFrame(function () { try { fit.fit(); } catch (e) {} sendResize(); });
  });
  ro.observe(bodyEl);

  if (live) connect();

  // ---- public surface ------------------------------------------------------------------
  return {
    pane: pane, term: term,
    write: function (d) { term.write(d); },        // host-injected data (tests, mocks)
    dispose: function () {
      if (disposed) return;
      disposed = true;
      clearTimeout(retryTimer);
      cancelAnimationFrame(fitReq);
      ro.disconnect();
      if (sock) { sock.onclose = sock.onerror = sock.onmessage = sock.onopen = null;
                  try { sock.close(); } catch (e) {} }
      try { term.dispose(); } catch (e) {}
      pane.remove();
    },
  };
}

/* ---- lazy vendored xterm.js load (first live use only) ---- */
var xtermLoad = null;
function ensureXterm() {
  if (window.Terminal && window.FitAddon && window.WebglAddon) return Promise.resolve();
  if (!xtermLoad) {
    var load = function (src) {
      return new Promise(function (res, rej) {
        var s = document.createElement("script");
        s.src = src;
        s.onload = function () { res(); };
        s.onerror = function () { rej(new Error("load failed: " + src)); };
        document.head.appendChild(s);
      });
    };
    xtermLoad = load("/vendor/xterm/xterm.js")
      .then(function () { return load("/vendor/xterm/addon-fit.js"); })
      .then(function () { return load("/vendor/xterm/addon-webgl.js"); })
      .catch(function (err) { xtermLoad = null; throw err; });   // allow retry after a failed load
  }
  return xtermLoad;
}

/* ---- agent → interactive command ---- */
// Non-interactive flags so the pane doesn't die on a trust/approval prompt.
var AGENT_CMDS = {
  claude:  ["claude", "--dangerously-skip-permissions"],
  opencode: ["opencode"],
  kiro:    ["kiro-cli", "chat", "--trust-all-tools"],
  codex:   ["codex", "--full-auto"],
  gemini:  ["gemini", "--yolo"],
};
function agentCommand(agent) {
  var a = (agent || "").toLowerCase();
  for (var k in AGENT_CMDS) {
    if (a === k || a.indexOf(k + "-") === 0 || a.indexOf(k + " ") === 0) return AGENT_CMDS[k].slice();
  }
  return ["bash", "-i"];
}

/* ---- live session lifecycle ---- */
var MODE = "feed";     // "feed" | "live"
var livePane = null;   // createTermPane result while a live session is mounted
var liveId = null;     // PTY session id — killed on teardown
var liveSeq = 0;       // guards async spawns against mode switches / collapse / retry

function killPty(id) {
  if (!id) return;
  try {
    fetch("/api/pty/" + encodeURIComponent(id) + "/kill?token=" + encodeURIComponent(TOKEN), { method: "POST" })
      .catch(function () { /* best effort; server reaps idle sessions */ });
  } catch (e) { /* best effort */ }
}

function stopLive() {
  liveSeq++;                        // invalidate any in-flight spawn
  if (livePane) { try { livePane.dispose(); } catch (e) {} livePane = null; }
  killPty(liveId);
  liveId = null;
}

function liveErr(msg, hint) {
  var box = $("liveBox");
  box.textContent = "";
  var d = el("div", "term-err", msg);
  if (hint) d.appendChild(el("small", null, hint));
  box.appendChild(d);
}

function startLive() {
  var seq = ++liveSeq;
  var box = $("liveBox");
  box.textContent = "";
  if (rec && rec.source === "external") {
    box.appendChild(el("div", "player-msg", "external run — no local terminal to attach"));
    $("termMeta").textContent = "external run";
    return;
  }
  box.appendChild(el("div", "player-msg", "spawning live session\u2026"));
  $("termMeta").textContent = "live pty";
  var cmd = agentCommand(rec && rec.agent);
  ensureXterm()
    .then(function () {
      if (seq !== liveSeq) return null;
      return fetch("/api/pty?token=" + encodeURIComponent(TOKEN), {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ command: cmd[0], args: cmd.slice(1), runId: RUN_ID }),
      }).then(function (r) {
        if (!r.ok) throw new Error("http " + r.status + " from /api/pty");
        return r.json();
      });
    })
    .then(function (info) {
      if (seq !== liveSeq) { if (info && info.id) killPty(info.id); return; }  // stale spawn: don't leak it
      if (!info || !info.id) throw new Error("spawn response missing id");
      liveId = info.id;
      livePane = createTermPane(box, { id: info.id, token: TOKEN, live: true, command: cmd.join(" ") });
      $("termMeta").textContent = "live pty \u00b7 " + cmd.join(" ");
    })
    .catch(function (err) {
      if (seq !== liveSeq) return;
      liveErr(
        "live terminal unavailable \u2014 " + ((err && err.message) || "network error"),
        "click \u201clive terminal\u201d to retry, or go back to the feed."
      );
      $("termMeta").textContent = "live pty \u00b7 spawn failed";
    });
}

function setMode(mode) {
  MODE = mode;
  var isLive = mode === "live";
  $("modeFeed").classList.toggle("on", !isLive);
  $("modeFeed").setAttribute("aria-pressed", String(!isLive));
  $("modeLive").classList.toggle("on", isLive);
  $("modeLive").setAttribute("aria-pressed", String(isLive));
  var drawer = $("drawer");
  drawer.classList.toggle("live", isLive);
  if (!isLive) drawer.classList.remove("max");
  $("termSize").hidden = !isLive;
  // the feed's DOM (and its socket) survive a live detour untouched
  $("feedBox").hidden = isLive;
  $("liveBox").hidden = !isLive;
  if (isLive) {
    drawer.classList.remove("min");  // live always opens the drawer
    var t = $("drawerToggle");
    t.setAttribute("aria-expanded", "true");
    t.setAttribute("aria-label", "collapse drawer");
    if (!livePane) startLive();      // fresh spawn; also the retry path after a failure
  } else {
    stopLive();                      // mode switch away from live: dispose + kill, no leaks
    openFeed();
    if (feedOpened) $("termMeta").textContent = feedEnded ? "ended" : "live";
  }
}

function openFeed() {
  if (feedOpened || !RUN_ID) return;
  var box = $("feedBox");
  if (!window.HarnessFeed) {
    $("termMeta").textContent = "feed unavailable";
    box.textContent = "/feed.js failed to load";
    return;
  }
  feedOpened = true;
  $("termMeta").textContent = "connecting";
  feed = window.HarnessFeed.create(box);
  feedConn = window.HarnessFeed.connect(feed, {
    runId: RUN_ID,
    token: TOKEN,
    onRecord: function (r) { rec = r; renderHeader(); },
    onStatus: function (s) {
      // "ended" is terminal: the socket's own close event fires after it and
      // must not downgrade the label back to "idle".
      if (feedEnded) return;
      if (s === "ended") feedEnded = true;
      // a live-terminal detour owns the meta line; the feed reclaims it on return
      if (MODE === "live") return;
      $("termMeta").textContent = s === "open" ? "live" : s === "closed" ? "idle" : s;
    },
  });
}

/* ===== data loading ===== */
function fetchObs() {
  return api("/api/runs/" + encodeURIComponent(RUN_ID) + "/observability")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      obs = {
        spans: (data && data.spans) || [],
        metrics: (data && data.metrics) || [],
        logs: (data && data.logs) || [],
        totalCostUsd: (data && data.totalCostUsd) || 0,
        durationMs: (data && data.durationMs) || 0,
      };
    });
}
function fetchRec() {
  return api("/api/runs")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var records = (data && data.records) || [];
      rec = null;
      for (var i = 0; i < records.length; i++) {
        if (records[i].runId === RUN_ID) { rec = records[i]; break; }
      }
    })
    .catch(function () { rec = null; });
}
function renderAll() {
  $("fatal").hidden = true;
  $("main").hidden = false;
  renderHeader();
  renderTraces();
  renderMetrics();
  renderLogs();
}
function refreshLive() {
  fetchRec().then(function () {
    renderHeader();
    if (!isLive() && pollTimer) { clearInterval(pollTimer); pollTimer = null; return; }
    return fetchObs().then(function () {
      // keep selection only if the span still exists
      if (sel) {
        var still = obs.spans.some(function (s) { return s.id === sel.id; });
        if (!still) sel = null;
      }
      renderAll();
    });
  }).catch(function () { /* transient poll failure; keep last view */ });
}
function startPollingIfLive() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  if (isLive()) pollTimer = setInterval(refreshLive, 5000);
}

/* ===== events ===== */
$("traceList").addEventListener("click", function (e) {
  var t = e.target.closest ? e.target.closest(".span") : null;
  if (t) pickSpan(t.dataset.id);
});
$("traceList").addEventListener("keydown", function (e) {
  if (e.key !== "Enter" && e.key !== " ") return;
  var t = e.target.closest ? e.target.closest(".span") : null;
  if (t) { e.preventDefault(); pickSpan(t.dataset.id); }
});
$("logFilter").addEventListener("click", clearSel);
$("chartbox").addEventListener("mousemove", chartMove);
$("chartbox").addEventListener("mouseleave", chartLeave);
$("modeFeed").addEventListener("click", function () { setMode("feed"); });
$("modeLive").addEventListener("click", function () { setMode("live"); });
$("termSize").addEventListener("click", function () {
  var max = $("drawer").classList.toggle("max");
  this.setAttribute("aria-label", max ? "restore terminal size" : "expand terminal to near full screen");
  this.setAttribute("title", max ? "restore size" : "near full screen");
});
var DRAWER_KEY = "harness.trio.drawer";
function setDrawer(min, persist) {
  $("drawer").classList.toggle("min", min);
  var btn = $("drawerToggle");
  btn.setAttribute("aria-expanded", String(!min));
  btn.setAttribute("aria-label", min ? "expand drawer" : "collapse drawer");
  if (persist) { try { sessionStorage.setItem(DRAWER_KEY, min ? "min" : "open"); } catch (e) { /* noop */ } }
  if (min) {
    if (MODE === "live") setMode("feed");   // collapsing the drawer closes the live session
    return;
  }
  openFeed();
}
$("drawerToggle").addEventListener("click", function () {
  setDrawer(!$("drawer").classList.contains("min"), true);
});
addEventListener("beforeunload", function () {
  // page unload: fetch may be cancelled — sendBeacon delivers the kill reliably
  if (liveId) {
    try {
      navigator.sendBeacon("/api/pty/" + encodeURIComponent(liveId) + "/kill?token=" + encodeURIComponent(TOKEN));
    } catch (e) { /* best effort */ }
  }
});

/* ===== init ===== */
function init() {
  if (!RUN_ID) {
    fatal("no run selected", "open this page as /trio?run=<runId> (an optional &token= is forwarded to the grid).", true);
    return;
  }
  fetchObs()
    .then(function () { return fetchRec(); })
    .then(function () {
      renderAll();
      startPollingIfLive();
      var stored = null;
      try { stored = sessionStorage.getItem(DRAWER_KEY); } catch (e) { /* noop */ }
      if (stored === "min") setDrawer(true, false);
      openFeed();
    })
    .catch(function (err) {
      var msg = err && err.message === "http 404"
        ? "run \u201c" + RUN_ID + "\u201d is not in the registry \u2014 it may have been pruned, or the harness state dir differs from this server's."
        : "failed to load observability data (" + ((err && err.message) || "network error") + "). Is the harness web server running?";
      fatal("run not found", msg, true);
    });
}
init();
})();
</script>
</body>
</html>
