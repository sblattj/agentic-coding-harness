<!doctype html>
<!--
  ach desks (#205). One static page over the Desks Web API (/api/desks*, contract in
  src/desks/types.ts): desk grid with a chat per desk, lane strip, message timeline,
  decision cards, live feed pin, pending lanes and costs. Live updates come from the
  /api/desks/stream SSE. Reads ?token=<token>&stack=<stack>. No frameworks, no
  external requests; all agent/message text is inserted as textContent.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>ach desks</title>
<link rel="icon" href="data:,">
<style>
* { box-sizing: border-box; margin: 0; }
:root {
  --bg: #0a0d14; --panel: #0e1219; --panel2: #141a26;
  --line: #1d2433; --line2: #2b3549;
  --fg: #dce3f2; --dim: #8a94ac; --faint: #5a6478;
  --cyan: #67d5f5; --teal: #5eead4; --blue: #7aa2f7;
  --purple: #bb9af7; --green: #a5d97a; --amber: #e6c07b; --red: #ff7590;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
}
body {
  height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  background: radial-gradient(1100px 500px at 30% -10%, #101728 0%, var(--bg) 55%);
  color: var(--fg); font: 13px/1.45 var(--sans);
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, textarea, select {
  font: 12px var(--mono); color: var(--fg); background: var(--panel2);
  border: 1px solid var(--line2); border-radius: 6px; padding: 5px 7px;
}
textarea { resize: vertical; }
:focus-visible { outline: 1px solid var(--cyan); outline-offset: 2px; border-radius: 4px; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }
.btn {
  font: 600 11px var(--mono); letter-spacing: .04em; padding: 3px 9px;
  border: 1px solid var(--line2); border-radius: 6px; color: var(--cyan); white-space: nowrap;
}
.btn:hover { border-color: var(--cyan); background: color-mix(in oklab, var(--cyan) 10%, transparent); }
.btn.warn { color: var(--red); }
.btn.warn:hover { border-color: var(--red); background: color-mix(in oklab, var(--red) 10%, transparent); }
.btn.rec { color: var(--green); border-color: color-mix(in oklab, var(--green) 50%, var(--line2)); }
.btn:disabled { opacity: .45; cursor: default; }

/* ===== header ===== */
header {
  display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 6px 14px; flex: none;
  background: color-mix(in oklab, var(--panel) 88%, transparent);
  border-bottom: 1px solid var(--line); backdrop-filter: blur(6px);
}
.mark { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.mark small { color: var(--faint); font-weight: 500; font-size: 11px; letter-spacing: .08em; }
.pagenav { display: flex; gap: 2px; white-space: nowrap; }
.pagenav a {
  color: var(--dim); text-decoration: none; font: 600 11px var(--mono); letter-spacing: .06em;
  padding: 3px 9px; border: 1px solid transparent; border-radius: 6px;
}
.pagenav a:hover { color: var(--fg); border-color: var(--line2); }
.pagenav a.active { color: var(--cyan); border-color: var(--line2); }
.stackmeta { font: 12px var(--mono); color: var(--dim); white-space: nowrap; }
.pulse { display: flex; align-items: center; gap: 7px; margin-left: auto; font: 11.5px var(--mono); color: var(--dim); white-space: nowrap; }
.pulse i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.pulse.on { color: var(--green); }
.pulse.on i { background: var(--green); animation: ping 1.6s ease-out infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(165, 217, 122, .55); } 70%, 100% { box-shadow: 0 0 0 6px rgba(165, 217, 122, 0); } }
.tcost { font: 11px var(--mono); color: var(--faint); white-space: nowrap; }
.tcost b { color: var(--fg); }
#err { font: 11px var(--mono); color: var(--red); max-width: 40ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ===== layout ===== */
#app { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
#mainCol { min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
#side { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
section.panel { border-bottom: 1px solid var(--line); padding: 8px 10px; }
section.panel > h2 {
  display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
  font: 600 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint);
}
section.panel > h2 .count { color: var(--amber); }
.empty { color: var(--faint); font: 11.5px var(--mono); padding: 4px 0; }

/* ===== desk grid ===== */
#desk-grid {
  flex: 1; min-height: 0; display: grid; gap: 8px; padding: 8px;
  grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
  grid-auto-rows: minmax(220px, 1fr);
  grid-template-areas: "left rt" "left rb";
}
#desk-grid.noDesks { display: flex; align-items: center; justify-content: center; }
.desk { min-height: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.desk.slot-left { grid-area: left; }
.desk.slot-right-top { grid-area: rt; }
.desk.slot-right-bottom { grid-area: rb; }
.desk.slot-extra { grid-column: 1 / -1; }
.desk.flash { border-color: var(--cyan); }
.dhead { display: flex; align-items: center; gap: 8px; padding: 6px 9px; border-bottom: 1px solid var(--line); background: var(--panel2); font: 12px var(--mono); }
.dhead b { font-weight: 700; }
.dhead .role, .dhead .agent { color: var(--faint); font-size: 11px; }
.dhead .sp { flex: 1; }
.badge { font: 600 10px var(--mono); letter-spacing: .06em; padding: 1px 6px; border-radius: 10px; border: 1px solid var(--line2); color: var(--dim); text-transform: uppercase; }
.badge.s-idle { color: var(--teal); }
.badge.s-busy { color: var(--amber); border-color: color-mix(in oklab, var(--amber) 50%, var(--line2)); }
.badge.s-starting, .badge.s-stopping { color: var(--blue); }
.badge.s-error, .badge.s-dead { color: var(--red); }
.badge.s-active { color: var(--amber); }
.badge.s-achieved { color: var(--green); }
.badge.s-blocked, .badge.s-stopped { color: var(--red); }
.qd, .cost { color: var(--dim); font-size: 11px; }
.chat { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 9px; display: flex; flex-direction: column; gap: 4px; font: 12px/1.45 var(--mono); }
.ev { white-space: pre-wrap; word-break: break-word; }
.ev.text { color: var(--fg); }
.ev.min, .ev.mout { padding: 3px 7px; border-radius: 6px; background: color-mix(in oklab, var(--blue) 9%, transparent); border-left: 2px solid var(--blue); }
.ev.mout { background: color-mix(in oklab, var(--purple) 9%, transparent); border-left-color: var(--purple); }
.ev .who { color: var(--dim); font-size: 10.5px; display: block; }
.ev.tool { color: var(--faint); font-size: 11px; }
.ev.err { color: var(--red); }
.ev.hl { outline: 1px solid var(--cyan); }
.send { display: flex; gap: 6px; padding: 6px; border-top: 1px solid var(--line); }
.send input { flex: 1; min-width: 0; }
.dfoot { display: flex; gap: 6px; align-items: center; padding: 0 6px 6px; font: 11px var(--mono); color: var(--faint); }
.dfoot select { padding: 2px 4px; font-size: 11px; }

/* ===== lane strip ===== */
#lane-strip { flex: none; border-top: 1px solid var(--line); padding: 8px; max-height: 45vh; overflow-y: auto; }
#lane-strip > .bar { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font: 600 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
#lane-cards { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.lane { flex: none; width: 270px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; font: 11.5px var(--mono); }
.lane:hover { border-color: var(--line2); }
.lane .top { display: flex; align-items: center; gap: 6px; }
.lane .top b { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lane .goal { color: var(--dim); max-height: 3em; overflow: hidden; }
.lane .meta { display: flex; gap: 10px; color: var(--faint); }
.budget { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.budget i { display: block; height: 100%; background: var(--teal); }
.budget.over i { background: var(--red); }
.lane .acts { display: flex; gap: 6px; }
.lane .steer { display: flex; gap: 4px; }
.lane .steer input { flex: 1; min-width: 0; }
#new-lane-form { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; padding: 8px; border: 1px solid var(--line2); border-radius: 8px; background: var(--panel); }
#new-lane-form[hidden] { display: none; }
#new-lane-form label { display: flex; flex-direction: column; gap: 2px; font: 10.5px var(--mono); color: var(--faint); }
#new-lane-form .wide { grid-column: 1 / -1; }
#nl-mcps { display: flex; flex-wrap: wrap; gap: 4px 10px; font: 11px var(--mono); color: var(--dim); }
#nl-mcps label { flex-direction: row; align-items: center; gap: 4px; color: var(--dim); }

/* ===== side panels ===== */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; margin-bottom: 6px; font: 12px var(--mono); }
.card .q { white-space: pre-wrap; margin-bottom: 5px; }
.card .by { color: var(--faint); font-size: 10.5px; margin-bottom: 5px; }
.card .opts { display: flex; flex-direction: column; gap: 4px; margin-bottom: 5px; }
.card .opts .btn { text-align: left; white-space: normal; }
.card .reason { display: block; color: var(--faint); font-weight: 400; font-size: 10.5px; }
.card .free { display: flex; gap: 4px; }
.card .free input { flex: 1; min-width: 0; }
.card .acts { display: flex; gap: 6px; margin-top: 4px; }
#feed-panel .feedtext { white-space: pre-wrap; font: 12px/1.45 var(--mono); max-height: 30vh; overflow-y: auto; }
#feed-panel .when { color: var(--faint); font: 10.5px var(--mono); }
#timeline-filter { width: 100%; margin-bottom: 6px; }
#timeline-list { display: flex; flex-direction: column; gap: 3px; max-height: 40vh; overflow-y: auto; }
.tl { cursor: pointer; padding: 3px 5px; border-radius: 5px; font: 11.5px var(--mono); }
.tl:hover { background: var(--panel2); }
.tl .hd { color: var(--dim); font-size: 10.5px; }
.tl .hd b { color: var(--cyan); font-weight: 600; }
.tl .tx { white-space: pre-wrap; word-break: break-word; max-height: 4.4em; overflow: hidden; }
table.costs { width: 100%; border-collapse: collapse; font: 11.5px var(--mono); }
table.costs th { text-align: left; color: var(--faint); font-weight: 600; font-size: 10.5px; padding: 2px 4px; border-bottom: 1px solid var(--line); }
table.costs td { padding: 2px 4px; border-bottom: 1px solid var(--line); }
table.costs td.num, table.costs th.num { text-align: right; }

/* ===== lane modal ===== */
#lane-modal { position: fixed; inset: 0; background: rgba(4, 6, 10, .72); display: flex; align-items: stretch; justify-content: center; padding: 28px; z-index: 10; }
#lane-modal[hidden] { display: none; }
#lane-modal .desk { width: min(1100px, 100%); }
</style>
</head>
<body>
<header>
  <div class="mark">ach <small>DESKS</small></div>
  <nav class="pagenav" id="pagenav" aria-label="pages">
    <a href="/">runs</a>
    <a href="/grid">grid</a>
    <a href="/compare">compare</a>
    <a class="active" href="/desks">desks</a>
  </nav>
  <span class="stackmeta" id="stackmeta">stack &hellip;</span>
  <button class="btn" id="btn-up" type="button" title="start the layout (no terminal panes)">up</button>
  <button class="btn warn" id="btn-down" type="button" title="stop every lane and desk">down</button>
  <span id="err" role="status"></span>
  <div class="pulse" id="pulse"><i></i><span id="pulseTxt">connecting</span></div>
  <div class="tcost">&Sigma; <b id="totalCost">&ndash;</b></div>
</header>
<div id="app">
  <div id="mainCol">
    <div id="desk-grid" class="noDesks"><div class="empty">no desks running</div></div>
    <div id="lane-strip">
      <div class="bar">lanes <span class="count" id="laneCount"></span><button class="btn" id="btn-new-lane" type="button">+ new lane</button></div>
      <form id="new-lane-form" hidden autocomplete="off">
        <label>name<input name="name" required pattern="[A-Za-z0-9][A-Za-z0-9_-]{0,47}" placeholder="fix-login"></label>
        <label>engine<select name="agent" id="nl-agent"><option value="">layout default</option></select></label>
        <label class="wide">goal<textarea name="goal" rows="3" required placeholder="objective for the lane"></textarea></label>
        <label>cwd<input name="cwd" placeholder="layout default"></label>
        <label>budget USD<input name="budgetUsd" type="number" min="0" step="0.5" placeholder="layout default"></label>
        <label>model<input name="model" placeholder="engine default"></label>
        <div class="wide"><div class="empty" style="padding:0 0 2px">mcps</div><div id="nl-mcps"></div></div>
        <div class="wide" style="display:flex;gap:6px"><button class="btn" type="submit">start lane</button><button class="btn warn" type="button" id="nl-cancel">cancel</button></div>
      </form>
      <div id="lane-cards"><div class="empty">no lanes</div></div>
    </div>
  </div>
  <aside id="side">
    <section class="panel" id="feed-panel" hidden><h2>live feed</h2><div id="feed-body"></div></section>
    <section class="panel" id="decisions"><h2>decisions <span class="count" id="decCount"></span></h2><div id="decision-cards"><div class="empty">no open decisions</div></div></section>
    <section class="panel" id="pending"><h2>pending lanes <span class="count" id="pendCount"></span></h2><div id="pending-cards"><div class="empty">none</div></div></section>
    <section class="panel" id="timeline"><h2>messages</h2>
      <select id="timeline-filter" aria-label="filter by desk"><option value="">all desks</option></select>
      <div id="timeline-list"><div class="empty">no messages</div></div>
    </section>
    <section class="panel" id="costs"><h2>costs</h2><div id="costs-body"><div class="empty">&ndash;</div></div></section>
  </aside>
</div>
<div id="lane-modal" hidden></div>

<script>
"use strict";
(function () {
  /* ===== helpers ===== */
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = String(text);
    return n;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  var QS = new URLSearchParams(location.search);
  var TOKEN = QS.get("token") || "";
  var STACK = QS.get("stack") || "";
  function q(path) {
    var p = [];
    if (TOKEN) p.push("token=" + encodeURIComponent(TOKEN));
    if (STACK) p.push("stack=" + encodeURIComponent(STACK));
    if (!p.length) return path;
    return path + (path.indexOf("?") >= 0 ? "&" : "?") + p.join("&");
  }
  // nav links carry the token AND the selected stack (q), not just the token (#212 review)
  (function () {
    var links = document.querySelectorAll("#pagenav a");
    for (var i = 0; i < links.length; i++) links[i].href = q(links[i].getAttribute("href"));
  })();
  function api(method, path, body) {
    var init = { method: method, headers: {} };
    if (body !== undefined) { init.headers["content-type"] = "application/json"; init.body = JSON.stringify(body); }
    return fetch(q("/api/desks" + path), init).then(function (r) {
      return r.text().then(function (t) {
        var v = null;
        try { v = t ? JSON.parse(t) : {}; } catch (e) { v = { error: t }; }
        if (!r.ok) throw new Error((v && v.error) || ("HTTP " + r.status));
        return v;
      });
    });
  }
  var errTimer = null;
  function showErr(e) {
    var m = e && e.message ? e.message : String(e);
    $("err").textContent = m;
    $("err").title = m;
    if (errTimer) clearTimeout(errTimer);
    errTimer = setTimeout(function () { $("err").textContent = ""; }, 8000);
  }
  function fmtCost(v) { return v == null ? "n/a" : "$" + (v < 10 ? v.toFixed(3) : v.toFixed(2)); }
  function fmtTime(ms) { var d = new Date(ms); return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }); }
  function fmtElapsed(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    s = s % 60;
    return (h ? h + "h" : "") + (h || m ? m + "m" : "") + s + "s";
  }
  function debounce(fn, ms) {
    var t = null;
    return function () { if (t) clearTimeout(t); t = setTimeout(function () { t = null; fn(); }, ms); };
  }

  /* ===== state ===== */
  var view = null;                 // RosterView
  var chats = {};                  // name -> {runId, lastSeq, events: [], nodes: [DOM chat containers]}
  var messages = [];               // DeskMessage[]
  var messageIds = {};
  var decisions = {};              // id -> Decision (open ones shown)
  var feeds = {};                  // desk name -> {text, at}
  var engines = [];
  var mcpNames = [];
  var modalLane = null;
  var MAX_EVENTS = 300;

  /* ===== chats (one per desk/lane) ===== */
  function chatOf(row) {
    var c = chats[row.name];
    if (!c || c.runId !== row.runId) {
      c = chats[row.name] = { runId: row.runId, lastSeq: 0, floor: 0, seen: new Set(), events: [], nodes: [], loading: false, loaded: false, pending: [], pendingTruncated: false };
    }
    return c;
  }
  function loadHistory(row) {
    var c = chatOf(row);
    if (c.loaded || c.loading) return;
    c.loading = true;
    // Live events that arrive before the history are held in c.pending and replayed after it,
    // so the seq high-water mark never drops the history.
    var drain = function () {
      var held = c.pending;
      c.pending = [];
      c.pendingTruncated = false; // the full since=0 history above covers whatever the capped buffer dropped
      for (var j = 0; j < held.length; j++) addEvent(held[j], false);
    };
    api("GET", "/" + encodeURIComponent(row.name) + "/events?since=0").then(function (r) {
      c.loading = false;
      c.loaded = true; // only a successful fetch marks the history loaded; a failure leaves it retryable
      var evs = (r.events || []).slice(-MAX_EVENTS);
      for (var i = 0; i < evs.length; i++) addEvent(evs[i], true);
      renderAllChatNodes(row.name);
      renderFeeds();
      drain();
      if (es && es.readyState === 1) resyncChats(); // the stream may have opened while history loaded
    }).catch(function (e) { c.loading = false; showErr(e); drain(); }); // loaded stays false: the next loadHistory retries
  }
  function eventNode(name, ev) {
    var d = ev.data || {};
    var n = null;
    if (ev.type === "text" && typeof d.text === "string") n = el("div", "ev text", d.text);
    else if ((ev.type === "message_in" || ev.type === "message_out") && d.message) {
      var m = d.message;
      n = el("div", "ev " + (ev.type === "message_in" ? "min" : "mout"));
      n.appendChild(el("span", "who", (m.from || "?") + " → " + (m.to || name) + "  " + fmtTime(m.at || ev.at)));
      n.appendChild(document.createTextNode(m.text || ""));
      if (m.id) n.setAttribute("data-mid", m.id);
    } else if (ev.type === "tool") n = el("div", "ev tool", "→ " + (d.tool || "tool") + (d.summary ? " " + d.summary : ""));
    else if (ev.type === "error") n = el("div", "ev err", "error: " + (d.error || JSON.stringify(d)));
    else if (ev.type === "feed" && d.note) n = el("div", "ev tool", "feed: " + d.note);
    if (n) n.setAttribute("data-seq", String(ev.seq));
    return n;
  }
  function renderChatInto(name, box) {
    clear(box);
    var c = chats[name];
    if (!c) return;
    for (var i = 0; i < c.events.length; i++) {
      var n = eventNode(name, c.events[i]);
      if (n) box.appendChild(n);
    }
    box.scrollTop = box.scrollHeight;
  }
  function renderAllChatNodes(name) {
    var c = chats[name];
    if (!c) return;
    c.nodes = c.nodes.filter(function (b) { return document.body.contains(b); });
    for (var i = 0; i < c.nodes.length; i++) renderChatInto(name, c.nodes[i]);
  }
  var refetchRoster = debounce(function () { fetchRoster(); }, 1500);
  var refetchCosts = debounce(function () { fetchCosts(); }, 2500);
  function addEvent(ev, quiet) {
    var row = rowByName(ev.name);
    // An event that beats the roster still gets an unloaded chat: it buffers, and the first
    // loadHistory once the roster names the row fetches everything before it.
    var c = chatOf(row || { name: ev.name, runId: ev.runId });
    if (c.runId !== ev.runId) return;
    if (!c.loaded) {
      // An unopened chat only buffers the newest MAX_EVENTS; opening it loads the full history (since=0).
      c.pending.push(ev);
      if (c.pending.length > MAX_EVENTS) { c.pending.splice(0, c.pending.length - MAX_EVENTS); c.pendingTruncated = true; }
      return;
    }
    // Dedupe by seq, not a high-water mark: a catch-up response can bring seqs below one the
    // stream already delivered. `floor` is the highest seq trimmed from the rendered window.
    if (ev.seq <= c.floor || c.seen.has(ev.seq)) return;
    c.seen.add(ev.seq);
    if (ev.seq > c.lastSeq) c.lastSeq = ev.seq; // max seq, used for the ?since= query
    var inOrder = !c.events.length || ev.seq > c.events[c.events.length - 1].seq;
    if (inOrder) c.events.push(ev);
    else {
      var at = c.events.length;
      while (at > 0 && c.events[at - 1].seq > ev.seq) at--;
      c.events.splice(at, 0, ev);
    }
    if (c.events.length > MAX_EVENTS) {
      var cut = c.events.splice(0, c.events.length - MAX_EVENTS);
      for (var k = 0; k < cut.length; k++) { c.seen.delete(cut[k].seq); if (cut[k].seq > c.floor) c.floor = cut[k].seq; }
    }
    if (ev.type === "text" && row && row.feedPid && typeof (ev.data || {}).text === "string") {
      feeds[ev.name] = { text: ev.data.text, at: ev.at, active: feeds[ev.name] ? feeds[ev.name].active : undefined };
      if (!quiet) renderFeeds();
    }
    // Feed events carry data.active: true when a call starts, false on waiting / call ended.
    if (ev.type === "feed" && ev.data && typeof ev.data.active === "boolean") {
      var fd = feeds[ev.name] || (feeds[ev.name] = { text: "", at: ev.at });
      fd.active = ev.data.active;
      if (!quiet) renderFeeds();
    }
    if (quiet) return;
    if (!inOrder) renderAllChatNodes(ev.name); // late event: re-render so it sits in seq order
    if (ev.type === "status" && row && ev.data && ev.data.state) { row.state = ev.data.state; renderDesks(); renderLanes(); }
    if (ev.type === "goal" && row && ev.data && ev.data.goal) { row.goalStatus = ev.data.goal; renderLanes(); }
    if (ev.type === "usage" || ev.type === "turn_end" || ev.type === "status") { refetchRoster(); refetchCosts(); }
    if (!inOrder) return;
    var n = eventNode(ev.name, ev);
    if (!n) return;
    c.nodes = c.nodes.filter(function (b) { return document.body.contains(b); });
    for (var i = 0; i < c.nodes.length; i++) {
      var box = c.nodes[i];
      var atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
      box.appendChild(i === 0 ? n : n.cloneNode(true));
      while (box.childElementCount > MAX_EVENTS) box.removeChild(box.firstChild);
      if (atBottom) box.scrollTop = box.scrollHeight;
    }
  }
  function rowByName(name) {
    if (!view) return null;
    for (var i = 0; i < view.rows.length; i++) if (view.rows[i].name === name) return view.rows[i];

  }

  /* ===== a desk/lane card with chat + input ===== */

  function engineFoot(row) {

  /* ===== desk grid ===== */
  var SLOTS = ["left", "right-top", "right-bottom"];
  // Place each desk by its roster `pane` when the layout set one (left | right-top | right-bottom).
  // Without it, fall back to the guess: desk i of the layout listens on portBase + 1 + i, so port
  // order is layout order; unset desks take the free slots in that order, the rest are "extra".
  // Sorts `desks` into slot order in place and returns the slot of each, same index.
  function deskSlots(desks) {
    desks.sort(function (a, b) { return a.port - b.port; });
    var taken = {};
    desks.forEach(function (d) { if (SLOTS.indexOf(d.pane) >= 0 && !taken[d.pane]) taken[d.pane] = d.name; });
    var free = SLOTS.filter(function (s) { return !taken[s]; });
    var slotOf = {};
    desks.forEach(function (d) {
      slotOf[d.name] = taken[d.pane] === d.name ? d.pane : (d.pane === "none" ? "extra" : (free.shift() || "extra"));
    });
    var rank = function (d) { var i = SLOTS.indexOf(slotOf[d.name]); return i < 0 ? 9 : i; };
    desks.sort(function (a, b) { return rank(a) - rank(b) || a.port - b.port; });
    return desks.map(function (d) { return slotOf[d.name]; });
  }
  function renderDesks() {
    var grid = $("desk-grid");
    var desks = view ? view.rows.filter(function (r) { return r.kind === "desk"; }) : [];
    var slots = deskSlots(desks);
    // Re-rendering must not eat what the user is typing.
    var typed = {}, focused = null;
    var inputs = grid.querySelectorAll(".desk .send input");
    for (var k = 0; k < inputs.length; k++) {
      var nm = inputs[k].closest(".desk").getAttribute("data-desk");
      typed[nm] = inputs[k].value;
      if (document.activeElement === inputs[k]) focused = nm;
    }
    clear(grid);
    if (!desks.length) {
      grid.className = "noDesks";
      grid.appendChild(el("div", "empty", "no desks running (press up)"));
      return;
    }
    grid.className = "";
    for (var i = 0; i < desks.length; i++) {
      var card = deskCard(desks[i], slots[i]);
      var inp = card.querySelector(".send input");
      if (typed[desks[i].name]) inp.value = typed[desks[i].name];
      grid.appendChild(card);
      if (focused === desks[i].name) inp.focus();

    var filt = $("timeline-filter"), cur = filt.value;

    for (var j = 0; j < view.rows.length; j++) {
      var o = el("option", null, view.rows[j].name);
      o.value = view.rows[j].name;
      filt.appendChild(o);
    }
    filt.appendChild(new Option("human", "human"));
    filt.value = cur;
  }

  /* ===== lane strip ===== */
  function laneStatus(row) {

  /* ===== timeline ===== */
  function addMessage(m) {

  function renderTimeline() {

  $("timeline-filter").addEventListener("change", renderTimeline);
  function jumpTo(m) {
    var targets = [m.to, m.from];
    for (var i = 0; i < targets.length; i++) {
      var row = rowByName(targets[i]);
      if (!row) continue;
      if (row.kind === "lane") openLane(row.name);
      var boxes = document.querySelectorAll('.chat[data-chat="' + CSS.escape(row.name) + '"]');
      for (var j = 0; j < boxes.length; j++) {
        var hit = boxes[j].querySelector('[data-mid="' + CSS.escape(m.id) + '"]');
        var card = boxes[j].closest(".desk");
        if (card) { card.classList.add("flash"); setTimeout(function (c) { return function () { c.classList.remove("flash"); }; }(card), 1200); }
        if (hit) {
          hit.scrollIntoView({ block: "center" });
          hit.classList.add("hl");
          setTimeout(function (h) { return function () { h.classList.remove("hl"); }; }(hit), 1500);
          return;
        }
        boxes[j].scrollTop = boxes[j].scrollHeight;
      }
      if (boxes.length) return;
    }
  }

  /* ===== costs ===== */
  function fetchCosts() {
    return api("GET", "/costs").then(function (r) { renderCosts(r.rows || []); }).catch(function () { /* costs are best effort */ });
  }
  function renderCosts(rows) {
    var box = $("costs-body");
    clear(box);
    if (!rows.length) { box.appendChild(el("div", "empty", "no runs")); $("totalCost").textContent = "–"; return; }
    var t = el("table", "costs");
    var hr = el("tr");
    ["desk / lane", "cost", "in", "out"].forEach(function (h, i) { hr.appendChild(el("th", i ? "num" : null, h)); });
    t.appendChild(hr);
    var total = 0, any = false;
    function add(r, depth) {
      var tr = el("tr");
      tr.appendChild(el("td", null, (depth ? "  ".repeat(depth) + "└ " : "") + r.name));
      tr.appendChild(el("td", "num", fmtCost(r.costUsd)));
      tr.appendChild(el("td", "num", String(r.inputTokens || 0)));
      tr.appendChild(el("td", "num", String(r.outputTokens || 0)));
      t.appendChild(tr);
      if (r.costUsd != null) { total += r.costUsd; any = true; }
      (r.lanes || []).forEach(function (l) { add(l, depth + 1); });
    }
    rows.forEach(function (r) { add(r, 0); });
    box.appendChild(t);
    $("totalCost").textContent = any ? fmtCost(total) : "n/a";
  }

  /* ===== roster ===== */
  function applyView(v) {
    view = v;
    $("stackmeta").textContent = "stack " + v.stack + " · :" + v.portBase;
    (v.openDecisions || []).forEach(function (d) { decisions[d.id] = d; });
    var openIds = {};
    (v.openDecisions || []).forEach(function (d) { openIds[d.id] = true; });
    Object.keys(decisions).forEach(function (k) { if (decisions[k].state === "open" && !openIds[k]) delete decisions[k]; });
    renderDesks();
    renderLanes();
    renderDecisions();
    renderPending();
    renderFeeds();
    if (modalLane) renderModal();
  }
  function fetchRoster() {
    return api("GET", "").then(applyView).catch(showErr);
  }
  function fetchMessages() {
    var since = messages.length ? messages[messages.length - 1].at : 0;
    return api("GET", "/messages?since=" + since + "&limit=500").then(function (r) { (r.messages || []).forEach(addMessage); }).catch(showErr);
  }

  /* ===== live stream ===== */
  var es = null;
  var resyncOnSnapshot = false;
  // Which chats need a catch-up fetch after the stream (re)opens: every chat whose history has
  // loaded, from its seq high-water mark. A new stream subscribes to hosts from "now", so events
  // between the last frame and the new subscription are only recoverable from /events?since=.
  function resyncTargets(chatMap) {
    var out = [];
    Object.keys(chatMap).forEach(function (name) {
      var c = chatMap[name];
      if (c.loaded && !c.loading) out.push({ name: name, since: c.lastSeq });
    });
    return out;
  }
  function resyncChats() {
    resyncTargets(chats).forEach(function (t) {
      api("GET", "/" + encodeURIComponent(t.name) + "/events?since=" + t.since).then(function (r) {
        (r.events || []).forEach(function (ev) { addEvent(ev, false); }); // addEvent dedupes by seq and inserts late ones in order
      }).catch(showErr);
    });
  }
  function connect() {
    es = new EventSource(q("/api/desks/stream"));
    es.onopen = function () {
      $("pulse").className = "pulse on";
      $("pulseTxt").textContent = "live";
      fetchMessages();
      resyncChats();
      resyncOnSnapshot = true; // again after the first snapshot: the server reads hostLastSeq after it
    };
    es.onerror = function () {
      $("pulse").className = "pulse";
      $("pulseTxt").textContent = "reconnecting";
    };
    es.onmessage = function (e) {
      var f;
      try { f = JSON.parse(e.data); } catch (er) { return; }
      if (f.kind === "roster") {
        applyView(f.view); refetchCosts();
        if (resyncOnSnapshot) { resyncOnSnapshot = false; resyncChats(); }
      }
      else if (f.kind === "message") addMessage(f.message);
      else if (f.kind === "decision") { decisions[f.decision.id] = f.decision; renderDecisions(); }
      else if (f.kind === "event") addEvent(f.event, false);
    };
  }

  /* ===== header actions ===== */
  $("btn-up").addEventListener("click", function () {
    var b = $("btn-up");
    b.disabled = true;
    api("POST", "/up", {}).then(applyView).catch(showErr).then(function () { b.disabled = false; });
  });
  $("btn-down").addEventListener("click", function () {
    if (!confirm("Stop every lane and desk of this stack?")) return;
    var b = $("btn-down");
    b.disabled = true;
    api("POST", "/down", {}).then(fetchRoster).catch(showErr).then(function () { b.disabled = false; });
  });

  loadEngines().then(function () { if (view) renderDesks(); });
  fetchRoster().then(function () {
    return api("GET", "/decisions?state=open").then(function (r) { (r.decisions || []).forEach(function (d) { decisions[d.id] = d; }); renderDecisions(); }).catch(function () {});
  });
  fetchMessages();
  fetchCosts();
  connect();
})();
</script>
</body>
</html>
