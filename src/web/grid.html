<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>agentic-coding-harness · grid</title>
<link rel="icon" href="data:,">
<style>
/* ===== theme: dark terminal, green-on-black ===== */
:root {
  --bg: #050806;
  --panel: #0a0f0c;
  --panel2: #0d1410;
  --edge: #1b2a21;
  --edge2: #27402f;
  --green: #3dff7c;
  --green2: #1fae5a;
  --text: #cdeedd;
  --dim: #7fa08d;
  --faint: #52695c;
  --cyan: #5bd7dd;
  --amber: #ffcf6b;
  --red: #ff6f6f;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.45 var(--mono);
}
::selection { background: rgba(61, 255, 124, .25); }

/* subtle CRT veil: static gradients only, no animation */
#fx {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 99;
  background:
    radial-gradient(120% 90% at 50% 0%, transparent 60%, rgba(0, 0, 0, .35)),
    repeating-linear-gradient(0deg, rgba(0, 0, 0, .14) 0 1px, transparent 1px 3px);
  opacity: .5;
}

.app { position: relative; min-height: 100vh; display: flex; flex-direction: column; }

/* ===== header ===== */
#hdr {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 14px;
  height: 46px;
  background: linear-gradient(180deg, #0c1310, #080d0a);
  border-bottom: 1px solid var(--edge);
}
.brand { display: flex; align-items: baseline; gap: 9px; white-space: nowrap; }
.glyph { color: var(--green); text-shadow: 0 0 10px rgba(61, 255, 124, .6); letter-spacing: -1px; }
.wordmark { font-weight: 700; letter-spacing: .14em; color: var(--text); text-shadow: 0 0 12px rgba(61, 255, 124, .28); }
.modelabel {
  font-size: 10px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: #04120a;
  background: var(--green);
  border-radius: 3px;
  padding: 2px 7px;
  font-weight: 700;
  box-shadow: 0 0 14px rgba(61, 255, 124, .35);
}
.hstats { display: flex; gap: 8px; flex: 1; min-width: 0; overflow: hidden; }
.pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 4px 10px;
  font-size: 11px;
  color: var(--dim);
  border: 1px solid var(--edge);
  border-radius: 3px;
  background: var(--panel);
  white-space: nowrap;
}
.pill b { color: var(--text); font-weight: 600; }
.pill.live b { color: var(--green); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
.dot.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.hctl { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.pagenav { display: flex; gap: 2px; white-space: nowrap; }
.pagenav a {
  color: var(--dim);
  text-decoration: none;
  font-size: 11px;
  letter-spacing: .06em;
  padding: 2px 8px;
  border: 1px solid transparent;
  border-radius: 3px;
}
.pagenav a:hover { color: var(--text); border-color: var(--edge); }
.pagenav a.active { color: var(--green); border-color: var(--green2); }
.wspill { font-size: 11px; color: var(--faint); }
.wspill.on { color: var(--green2); }
.clock { color: var(--faint); font-size: 11px; }

/* ===== grid ===== */
main { flex: 1; display: block; }
#grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-auto-rows: 340px;
  gap: 10px;
  padding: 10px;
}
#empty {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 200px;
  color: var(--faint);
  padding: 20px;
  text-align: center;
}

/* ===== tile ===== */
.tile {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  cursor: pointer;
  background: var(--panel);
  border: 1px solid var(--edge);
  border-radius: 5px;
  overflow: hidden;
  box-shadow: inset 0 0 40px rgba(0, 0, 0, .35);
  transition: border-color .15s;
}
.tile:hover { border-color: var(--edge2); }
.tile.selected { border-color: var(--green2); box-shadow: 0 0 0 1px var(--green2), inset 0 0 40px rgba(0, 0, 0, .35); }
.tile:focus-visible, .trio:focus-visible { outline: 1px dashed var(--green); outline-offset: 2px; }

.tbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 10px;
  font-size: 11px;
  color: var(--dim);
  border-bottom: 1px solid var(--edge);
  background: #0b110e;
  white-space: nowrap;
  overflow: hidden;
}
.tbar .dot { flex: none; }
.tbar .dot.off { background: var(--faint); box-shadow: none; }
.tbar .dot.err { background: var(--red); box-shadow: 0 0 8px var(--red); }
.tname { color: var(--green); font-weight: 700; letter-spacing: .06em; }
.tname::before { content: "❯ "; color: var(--faint); font-weight: 400; }
.tmodel { color: var(--faint); font-size: 10px; overflow: hidden; text-overflow: ellipsis; }
.tspace { flex: 1; }
.tstat { color: var(--dim); }
.tstat b { color: var(--text); font-weight: 600; }
.tstat.cost b { color: var(--amber); }
.trio {
  flex: none;
  font: inherit;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 2px 7px;
  border: 1px solid var(--cyan);
  border-radius: 5px;
  background: transparent;
  color: var(--cyan);
  cursor: pointer;
  transition: background .15s, color .15s;
}
.trio:hover { background: var(--cyan); color: #000; }

.tprompt {
  flex: none;
  padding: 4px 10px;
  font-size: 11px;
  color: var(--dim);
  background: #090e0b;
  border-bottom: 1px solid var(--edge);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tbody {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  user-select: text;
  overscroll-behavior: contain;
  /* page theme -> feed theme (see /feed.js) */
  --feed-bg: var(--panel);
  --feed-fg: var(--text);
  --feed-dim: var(--faint);
  --feed-line: var(--edge);
  --feed-green: var(--green);
  --feed-red: var(--red);
  --feed-yellow: var(--amber);
  --feed-blue: var(--cyan);
  --feed-mono: var(--mono);
}
.tbody::-webkit-scrollbar { width: 8px; }
.tbody::-webkit-scrollbar-thumb { background: #1c2921; border-radius: 4px; }
.tbody::-webkit-scrollbar-track { background: transparent; }

/* ===== live PTY expansion ===== */
.tile.expanded {
  grid-column: 1 / -1;            /* span the full grid width */
  height: min(72vh, 680px);
  cursor: default;
}
/* the structured feed stays visible as a strip above the live terminal */
.tile.expanded .tbody { flex: 0 0 150px; }
.tlive {
  flex: 1;
  min-height: 0;
  display: flex;
  padding: 6px;
}
.tlive > .term-pane { flex: 1; min-width: 0; height: auto; }

/* LIVE button — mirrors .trio, but green; turns red when a pane is open */
.liveb {
  flex: none;
  font: inherit;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 2px 7px;
  border: 1px solid var(--green2);
  border-radius: 5px;
  background: transparent;
  color: var(--green);
  cursor: pointer;
  transition: background .15s, color .15s;
}
.liveb:hover { background: var(--green2); color: #000; }
.liveb:disabled { opacity: .5; cursor: wait; }
.liveb.on { border-color: var(--red); color: var(--red); }
.liveb.on:hover { background: var(--red); color: #000; }

/* ===== term-pane component styles (inlined from term-pane.html; "tp-" prefixed
   so they cannot collide with grid classes. Colors fall back to this page's
   --panel/--green/... palette, which is defined above). ===== */
.term-pane {
  --tp-panel:  var(--panel,  #0a0f0c);
  --tp-panel2: var(--panel2, #0d1410);
  --tp-line:   var(--line,   #16241b);
  --tp-text:   var(--text,   #cdeedd);
  --tp-dim:    var(--dim,    #7fa08d);
  --tp-green:  var(--green,  #3dff7c);
  --tp-red:    var(--red,    #ff6f6f);
  --tp-amber:  var(--amber,  #ffcf6b);
  --tp-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;

  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;                 /* lets the xterm body shrink inside flex hosts */
  background: var(--tp-panel);
  border: 1px solid var(--tp-line);
  border-radius: 8px;
  overflow: hidden;
  font: 12px/1.4 var(--tp-mono);
  color: var(--tp-text);
}
.term-pane .tp-bar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 10px;
  background: var(--tp-panel2);
  border-bottom: 1px solid var(--tp-line);
  font: 600 10.5px var(--tp-mono);
  letter-spacing: .06em;
  user-select: none;
}
.term-pane .tp-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--tp-dim);
  flex: none;
}
.term-pane .tp-dot.live {
  background: var(--tp-green);
  box-shadow: 0 0 8px var(--tp-green);
  animation: tp-pulse 1.6s ease-out infinite;
}
.term-pane .tp-dot.reconn { background: var(--tp-amber); box-shadow: 0 0 8px var(--tp-amber); }
.term-pane .tp-dot.dead  { background: var(--tp-red);   box-shadow: 0 0 8px var(--tp-red); }
.term-pane .tp-title {
  color: var(--tp-green);
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.term-pane .tp-stat { margin-left: auto; color: var(--tp-dim); font-weight: 400; white-space: nowrap; }
.term-pane .tp-stat.exited { color: var(--tp-red); }
.term-pane .tp-stat.reconn { color: var(--tp-amber); }
@keyframes tp-pulse {
  0%   { box-shadow: 0 0 0 0 rgba(255,255,255,.25), 0 0 8px var(--tp-green); }
  70%  { box-shadow: 0 0 0 6px transparent, 0 0 8px var(--tp-green); }
  100% { box-shadow: 0 0 0 0 transparent, 0 0 8px var(--tp-green); }
}
.term-pane .tp-body {
  flex: 1;
  min-height: 0;
  padding: 4px 2px 2px 6px;
  background: var(--tp-panel);
}
.term-pane .tp-body .terminal { padding: 0; }

/* ===== footer ===== */
#ftr {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  height: 28px;
  align-items: center;
  font-size: 10px;
  color: var(--faint);
  border-top: 1px solid var(--edge);
  background: #080d0a;
  white-space: nowrap;
  overflow: hidden;
}
#ftr .green { color: var(--green2); }

/* ===== responsive ===== */
@media (max-width: 860px) {
  #grid { grid-template-columns: minmax(0, 1fr); }
  #hdr { height: auto; flex-wrap: wrap; padding: 8px 12px; gap: 8px; }
  .hstats { order: 3; width: 100%; }
}

/* ===== reduced motion ===== */
@media (prefers-reduced-motion: reduce) {
  .dot.pulse { animation: none; }
  .tile, .trio, .liveb { transition: none; }
  .term-pane .tp-dot.live { animation: none; }
}
</style>

<body>

<div class="app">
  <header id="hdr">
    <div class="brand">
      <span class="glyph" aria-hidden="true">▚▞</span>
      <span class="wordmark">agentic-coding-harness</span>

  <main>
    <div id="grid" role="group" aria-label="Agent terminal panes"></div>

  <footer id="ftr">

    <span>live = running + heartbeat &lt; 60s</span>
  </footer>
</div>

<script>
"use strict";

/* createTermPane — inlined from src/web/term-pane.html (component only; the
   standalone ?demo block of that file is deliberately not copied).
   createTermPane(container, opts) -> { el, term, dispose, write }
   opts: { id, token, live = true, command }
   Requires the vendored globals loaded in <head>: Terminal, FitAddon, WebglAddon.
   WS protocol: server -> client raw PTY bytes (first frame = scrollback resync,
   then {"type":"exit","exitCode":N} before close); client -> server raw
   keystrokes + {"type":"resize","cols":C,"rows":R}. */
function createTermPane(container, opts) {
  if (typeof Terminal === "undefined")
    throw new Error("term-pane: host page must load /vendor/xterm/xterm.js (+ xterm.css, addon-fit.js, addon-webgl.js) first");
  const { id, token, command, live = true } = opts;
  if (!id) throw new Error("term-pane: opts.id is required");

  // ---- DOM: titlebar + terminal body ------------------------------------------------
  const el = document.createElement("div");
  el.className = "term-pane";
  el.innerHTML =
    '<div class="tp-bar">' +
      '<span class="tp-dot"></span>' +
      '<span class="tp-title"></span>' +
      '<span class="tp-stat"></span>' +
    '</div>' +
    '<div class="tp-body"></div>';
  const dotEl   = el.querySelector(".tp-dot");
  const titleEl = el.querySelector(".tp-title");
  const statEl  = el.querySelector(".tp-stat");
  const bodyEl  = el.querySelector(".tp-body");
  titleEl.textContent = command || id;
  container.appendChild(el);

  // ---- terminal ---------------------------------------------------------------------
  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const term = new Terminal({
    convertEol: true,
    cursorBlink: !reducedMotion,
    scrollback: 5000,
    fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace',
    fontSize: 12,
    theme: {           // hardcoded palette matching grid.html (xterm can't read CSS vars)
      background: "#0a0f0c", foreground: "#cdeedd", cursor: "#3dff7c",
      cursorAccent: "#0a0f0c", selectionBackground: "#1fae5a44",
      black: "#0a0f0c", red: "#ff6f6f", green: "#3dff7c", yellow: "#ffcf6b",
      blue: "#5bd7dd", magenta: "#c792ea", cyan: "#5bd7dd", white: "#cdeedd",
      brightBlack: "#7fa08d", brightWhite: "#ffffff",
    },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(bodyEl);                 // open BEFORE WebGL, per xterm docs
  try { term.loadAddon(new WebglAddon.WebglAddon()); } catch (e) { /* DOM renderer fallback */ }
  fit.fit();
  term.focus();

  // ---- status -----------------------------------------------------------------------
  let dead = false;                  // process exited: no more input, no reconnect
  function setStatus(cls, text) {
    dotEl.className = "tp-dot" + (cls ? " " + cls : "");
    statEl.className = "tp-stat" + (cls === "dead" ? " exited" : cls === "reconn" ? " reconn" : "");
    statEl.textContent = text;
  }
  setStatus(live ? "" : "", live ? "connecting…" : "offline");

  // ---- websocket --------------------------------------------------------------------
  let sock = null, disposed = false, firstFrame = false;
  let retryMs = 500, retryTimer = 0;
  let lastCols = -1, lastRows = -1;

  function connect() {
    if (disposed || dead || !live) return;
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const url = proto + "//" + location.host +
                "/ws/pty/" + encodeURIComponent(id) + "?token=" + encodeURIComponent(token);
    sock = new WebSocket(url);

    sock.onopen = () => {
      retryMs = 500;
      firstFrame = true;              // next frame is the scrollback resync
      setStatus("live", "live");
      lastCols = -1;                  // force-send size so the PTY matches the pane
      sendResize();
    };
    sock.onmessage = (ev) => {
      const data = ev.data;
      if (firstFrame) {               // server resends full scrollback on (re)connect
        term.reset();
        firstFrame = false;
      }
      const ctl = parseExitFrame(data);
      if (ctl) { onExit(ctl.exitCode); return; }
      term.write(data);               // raw PTY bytes, ANSI included — never escaped
    };
    sock.onclose = () => {
      if (disposed || dead || !live) return;
      setStatus("reconn", "reconnecting…");
      retryTimer = setTimeout(connect, retryMs);   // backoff: 0.5s → 1 → 2 → … → 8s cap
      retryMs = Math.min(retryMs * 2, 8000);
    };
    sock.onerror = () => { /* close event follows and drives reconnect */ };
  }

  // A control frame is a whole-frame JSON object with type:"exit"; anything else
  // (including raw output that merely starts with '{') is written verbatim.
  function parseExitFrame(d) {
    if (typeof d !== "string" || d.length < 20 || d.charCodeAt(0) !== 0x7b /* '{' */) return null;
    try {
      const j = JSON.parse(d);
      return (j && j.type === "exit") ? j : null;
    } catch { return null; }
  }

  function onExit(code) {
    dead = true;
    term.write("\r\n\x1b[2m[process exited " + (code ?? "?") + "]\x1b[22m\r\n"); // dim exit line
    setStatus("dead", "exited " + (code ?? "?"));
    try { sock && sock.close(); } catch {}
  }

  function sendResize() {
    if (!sock || sock.readyState !== 1 || dead) return;
    if (term.cols === lastCols && term.rows === lastRows) return;
    lastCols = term.cols; lastRows = term.rows;
    sock.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
  }

  // keystrokes → PTY, only while live, connected, and process alive
  term.onData((d) => {
    if (live && !dead && sock && sock.readyState === 1) sock.send(d);
  });

  // ---- resize tracking ---------------------------------------------------------------
  let fitReq = 0;
  const ro = new ResizeObserver(() => {
    if (disposed) return;
    cancelAnimationFrame(fitReq);
    fitReq = requestAnimationFrame(() => { try { fit.fit(); } catch {} sendResize(); });
  });
  ro.observe(bodyEl);

  if (live) connect();

  // ---- public surface ------------------------------------------------------------------
  return {
    el, term,
    write: (d) => term.write(d),        // host-injected data (tests, mocks)
    dispose() {
      if (disposed) return;
      disposed = true;
      clearTimeout(retryTimer);
      cancelAnimationFrame(fitReq);
      ro.disconnect();
      if (sock) { sock.onclose = sock.onerror = sock.onmessage = sock.onopen = null;
                  try { sock.close(); } catch {} }
      try { term.dispose(); } catch {}
      el.remove();
    },
  };
}
</script>

<script>
(function () {
  "use strict";

  var QS = new URLSearchParams(window.location.search);
  var TOKEN = QS.get("token") || "";
  var LIVE_MS = 60000;

  // nav links keep the session token when one is in play
  (function () {
    var qs = TOKEN ? "?token=" + encodeURIComponent(TOKEN) : "";
    var links = document.querySelectorAll(".pagenav a");
    for (var i = 0; i < links.length; i++) links[i].href += qs;
  })();

  var grid = document.getElementById("grid");
  var elRuns = document.getElementById("st-runs");
  var elTok = document.getElementById("st-tok");
  var elCost = document.getElementById("st-cost");
  var elClock = document.getElementById("clock");
  var elWs = document.getElementById("ws-state");

  // runId -> state object
  var runs = new Map();
  var selectedId = null;
  var lastOrder = "";

  function wsUrl(query) {
    var proto = window.location.protocol === "https:" ? "wss:" : "ws:";
    return proto + "//" + window.location.host + "/ws?" + query +
      (TOKEN ? "&token=" + encodeURIComponent(TOKEN) : "");
  }

  function isLive(rec, now) {
    if (rec.source === "external") return rec.endedAt == null;
    return rec.status === "running" && (now - rec.updatedAt) < LIVE_MS;
  }

  function fmtTok(n) {
    if (!isFinite(n)) return "0";
    if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
    return String(n);
  }

  function tokensOf(rec) {
    var t = rec && rec.totals ? rec.totals : null;
    if (!t) return 0;
    return (t.inputTokens || 0) + (t.outputTokens || 0) + (t.cacheReadTokens || 0) + (t.cacheWriteTokens || 0);
  }

  function fmtDur(ms) {
    if (!isFinite(ms) || ms < 0) ms = 0;
    var s = Math.floor(ms / 1000);
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var sec = s % 60;
    if (h > 0) return h + "h" + (m < 10 ? "0" : "") + m + "m";
    if (m > 0) return m + "m" + (sec < 10 ? "0" : "") + sec + "s";
    return sec + "s";
  }

  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  // ------- tile DOM -------

  function makeTile(rec) {
    var tile = document.createElement("section");
    tile.className = "tile";
    tile.setAttribute("role", "button");
    tile.setAttribute("tabindex", "0");
    tile.setAttribute("aria-label", "run " + rec.agent);

    var bar = document.createElement("div");
    bar.className = "tbar";
    var dot = document.createElement("span");
    dot.className = "dot";
    var name = document.createElement("span");
    name.className = "tname";
    var model = document.createElement("span");
    model.className = "tmodel";
    var space = document.createElement("span");
    space.className = "tspace";
    var trio = document.createElement("button");
    trio.className = "trio";
    trio.type = "button";
    trio.textContent = "TRIO ➜";
    trio.title = "open the detail view";
    var liveBtn = document.createElement("button");
    liveBtn.className = "liveb";
    liveBtn.type = "button";
    liveBtn.textContent = "TERM ➜";
    liveBtn.title = "spawn a live interactive terminal (PTY) for this agent";
    var tok = document.createElement("span");
    tok.className = "tstat";
    var cost = document.createElement("span");
    cost.className = "tstat cost";
    var elapsed = document.createElement("span");
    elapsed.className = "tstat";
    bar.appendChild(dot);
    bar.appendChild(name);
    bar.appendChild(model);
    bar.appendChild(space);
    bar.appendChild(trio);
    if (rec.source !== "external") bar.appendChild(liveBtn);   // no local PTY for external runs
    bar.appendChild(tok);
    bar.appendChild(cost);
    bar.appendChild(elapsed);

    var prompt = document.createElement("div");
    prompt.className = "tprompt";
    prompt.textContent = "❯ " + (rec.promptPreview || "(no prompt)");

    var body = document.createElement("div");
    body.className = "tbody";

    tile.appendChild(bar);
    tile.appendChild(prompt);
    tile.appendChild(body);

    return {
      tile: tile, dot: dot, name: name, model: model, trio: trio, liveBtn: liveBtn,
      tok: tok, cost: cost, elapsed: elapsed, prompt: prompt, body: body
    };
  }

  function statusLabel(st, live) {
    if (st === "running" && !live) return "interrupted";
    return st;
  }

  function updateHeader(st) {
    var rec = st.rec;
    var live = st.live;
    var d = st.dom.dot;
    d.className = "dot" + (live ? " pulse" : rec.status === "error" ? " err" : " off");
    st.dom.name.textContent = rec.agent || "unknown";
    var idText = rec.sessionId ? rec.sessionId : rec.runId;
    st.dom.model.textContent = String(idText || "").slice(0, 12);
    st.dom.tok.textContent = "";
    var bTok = document.createElement("b");
    bTok.textContent = fmtTok(tokensOf(rec));
    st.dom.tok.appendChild(document.createTextNode("tok "));
    st.dom.tok.appendChild(bTok);
    st.dom.cost.textContent = "";
    var bCost = document.createElement("b");
    bCost.textContent = "$" + (rec.totals && rec.totals.costUsd ? rec.totals.costUsd.toFixed(2) : "0.00");
    st.dom.cost.appendChild(document.createTextNode("cost "));
    st.dom.cost.appendChild(bCost);
    st.dom.tile.setAttribute("aria-label", "run " + (rec.agent || "?") + " " + statusLabel(rec.status, live));
  }

  function updateElapsed(st, now) {
    var rec = st.rec;
    var end = st.live ? now : rec.updatedAt;
    st.dom.elapsed.textContent = "";
    var b = document.createElement("b");
    b.textContent = fmtDur(end - rec.startedAt);
    st.dom.elapsed.appendChild(b);
  }

  // ------- per-run structured feed -------

  // Every tile — live or finished — gets the shared HarnessFeed. A finished run
  // receives its backlog followed by `end`, so the tile shows the whole run.
  function openRunFeed(st) {
    if (st.conn || !st.feed || !window.HarnessFeed) return;
    st.ended = false;
    st.conn = window.HarnessFeed.connect(st.feed, {
      runId: st.rec.runId,
      token: TOKEN,
      onRecord: function (record) {
        st.rec = record;
        st.live = isLive(st.rec, Date.now());
        updateHeader(st);
        updateElapsed(st, Date.now());
      },
      onEnd: function () { finishRun(st); },
    });
  }

  // State bookkeeping only: the feed appends its own "— stream ended —" row.
  function finishRun(st) {
    if (st.ended) return;
    st.ended = true;
    if (st.conn) { try { st.conn.close(); } catch (e) { /* noop */ } st.conn = null; }
    if (st.feed) st.feed.setEnded();
  }

  // ------- live interactive PTY -------

  // A one-line dim note appended into the tile's feed column. The old text
  // pane's appendLine() is gone; these are PTY-side failures, not run events,
  // so they are written straight into the feed container rather than injected
  // as synthetic AgentEvents.
  function liveNote(st, msg) {
    var row = document.createElement("div");
    row.className = "hf-row";
    row.appendChild(document.createElement("span")).className = "hf-gutter";
    var body = document.createElement("div");
    body.className = "hf-body";
    var text = document.createElement("div");
    text.className = "hf-text hf-dim";
    text.textContent = msg;
    body.appendChild(text);
    row.appendChild(body);
    st.dom.body.appendChild(row);
    st.dom.body.scrollTop = st.dom.body.scrollHeight;
  }

  var AGENT_PTY = {
    // Non-interactive flags so the pane doesn't die on a trust/approval prompt.
    claude: ["claude", "--dangerously-skip-permissions"],
    opencode: ["opencode"],
    kiro: ["kiro-cli", "chat", "--trust-all-tools"],
    codex: ["codex", "--full-auto"],
    gemini: ["gemini", "--yolo"],
  };

  function ptyCommandFor(agent) {
    var cmd = AGENT_PTY[String(agent || "").toLowerCase()];
    if (!cmd) cmd = ["bash", "-i"];       // generic fallback: interactive shell
    return { command: cmd[0], args: cmd.slice(1) };
  }

  function killPty(id) {
    if (!id) return;
    var url = "/api/pty/" + encodeURIComponent(id) + "/kill" +
      (TOKEN ? "?token=" + encodeURIComponent(TOKEN) : "");
    fetch(url, { method: "POST" }).catch(function () { /* already gone */ });
  }

  function resetLiveButton(st) {
    st.dom.liveBtn.disabled = false;
    st.dom.liveBtn.classList.remove("on");
    st.dom.liveBtn.textContent = "TERM ➜";
  }

  function closeLive(st) {
    if (st.pane) { try { st.pane.dispose(); } catch (e) { /* noop */ } st.pane = null; }
    var ptyId = st.ptyId;
    st.ptyId = null;
    if (st.liveHost) { st.liveHost.remove(); st.liveHost = null; }
    st.dom.tile.classList.remove("expanded");
    resetLiveButton(st);
    st.liveBusy = false;
    // the hidden event stream kept updating; park it at the bottom on return
    st.dom.body.scrollTop = st.dom.body.scrollHeight;
    killPty(ptyId);
  }

  function spawnLive(st) {
    if (st.liveBusy || st.pane) return;
    if (typeof Terminal === "undefined") {
      liveNote(st, "— live unavailable: vendored xterm assets failed to load —");
      return;
    }
    st.liveBusy = true;
    st.dom.liveBtn.disabled = true;
    st.dom.liveBtn.textContent = "TERM…";
    var cmd = ptyCommandFor(st.rec.agent);
    fetch("/api/pty" + (TOKEN ? "?token=" + encodeURIComponent(TOKEN) : ""), {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ command: cmd.command, args: cmd.args, cols: 120, rows: 34, runId: st.rec.runId })
    })
      .then(function (r) {
        if (!r.ok) {
          return r.json().catch(function () { return {}; }).then(function (j) {
            throw new Error((j && j.error) || "http " + r.status);
          });
        }
        return r.json();
      })
      .then(function (info) {
        st.liveBusy = false;
        if (!info || typeof info.id !== "string") throw new Error("spawn response missing id");
        st.ptyId = info.id;
        var host = document.createElement("div");
        host.className = "tlive";
        // keep terminal clicks/keys inside the pane: the tile's own handlers
        // would otherwise toggle selection and swallow Space/Enter keydowns
        host.addEventListener("click", function (ev) { ev.stopPropagation(); });
        host.addEventListener("keydown", function (ev) { ev.stopPropagation(); });
        st.dom.tile.appendChild(host);
        st.liveHost = host;
        st.dom.tile.classList.add("expanded");
        try {
          st.pane = createTermPane(host, {
            id: info.id,
            token: TOKEN,
            live: true,
            command: cmd.command + (cmd.args.length ? " " + cmd.args.join(" ") : "")
          });
        } catch (e) {
          // terminal stack failed to mount — tear down the session we just made
          host.remove();
          st.liveHost = null;
          st.dom.tile.classList.remove("expanded");
          killPty(st.ptyId);
          st.ptyId = null;
          resetLiveButton(st);
          liveNote(st, "— live failed: " + (e && e.message ? e.message : e) + " —");
          return;
        }
        st.dom.liveBtn.textContent = "✕ CLOSE";
        st.dom.liveBtn.disabled = false;
        st.dom.liveBtn.classList.add("on");
      })
      .catch(function (err) {
        st.liveBusy = false;
        resetLiveButton(st);
        liveNote(st, "— live spawn failed (" + cmd.command + "): " +
          (err && err.message ? err.message : err) + " —");
      });
  }

  function toggleLive(st) {
    if (st.liveBusy) return;
    if (st.pane || st.liveHost) closeLive(st);
    else spawnLive(st);
  }

  // ------- runs list -------

  function sortIds() {
    var ids = Array.from(runs.keys());
    var now = Date.now();
    ids.sort(function (a, b) {
      var ra = runs.get(a).rec, rb = runs.get(b).rec;
      var la = isLive(ra, now) ? 0 : 1;
      var lb = isLive(rb, now) ? 0 : 1;
      if (la !== lb) return la - lb;
      return rb.startedAt - ra.startedAt;
    });
    return ids;
  }

  function reorder() {
    var ids = sortIds();
    var sig = ids.join(",");
    if (sig !== lastOrder) {
      lastOrder = sig;
      for (var i = 0; i < ids.length; i++) {
        var st = runs.get(ids[i]);
        grid.appendChild(st.dom.tile); // appendChild moves existing nodes in order
      }
    }
  }

  function updateAggregates() {
    var now = Date.now();
    var live = 0, tok = 0, cost = 0;
    runs.forEach(function (st) {
      if (isLive(st.rec, now)) live++;
      tok += tokensOf(st.rec);
      cost += (st.rec.totals && st.rec.totals.costUsd) || 0;
    });
    elRuns.textContent = String(live);
    elTok.textContent = fmtTok(tok);
    elCost.textContent = "$" + cost.toFixed(2);
  }

  function handleRecords(records) {
    if (!Array.isArray(records)) return;
    var seen = new Set();
    for (var i = 0; i < records.length; i++) {
      var rec = records[i];
      if (!rec || typeof rec.runId !== "string") continue;
      seen.add(rec.runId);
      var st = runs.get(rec.runId);
      var live = isLive(rec, Date.now());
      if (!st) {
        var dom = makeTile(rec);
        st = {
          rec: rec, live: live, ended: false, conn: null, feed: null, dom: dom,
          pane: null, ptyId: null, liveHost: null, liveBusy: false
        };
        (function (state) {
          state.dom.tile.addEventListener("click", function () { select(state.rec.runId); });
          state.dom.tile.addEventListener("keydown", function (ev) {
            if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(state.rec.runId); }
          });
          state.dom.trio.addEventListener("click", function (ev) {
            ev.stopPropagation();
            goTrio(state.rec.runId);
          });
          state.dom.liveBtn.addEventListener("click", function (ev) {
            ev.stopPropagation();
            toggleLive(state);
          });
          state.dom.liveBtn.addEventListener("keydown", function (ev) {
            if (ev.key === "Enter" || ev.key === " ") ev.stopPropagation();
          });
        })(st);
        runs.set(rec.runId, st);
        grid.appendChild(dom.tile);
        if (window.HarnessFeed) {
          st.feed = window.HarnessFeed.create(dom.body, { compact: true, maxItems: 2000 });
        } else {
          dom.body.textContent = "feed unavailable (/feed.js failed to load)";
        }
        openRunFeed(st);
      } else {
        st.rec = rec;
        st.dom.prompt.textContent = "❯ " + (rec.promptPreview || "(no prompt)");
        if (live && !st.live && st.ended) {
          // transitioned back to live (e.g. heartbeat resumed): replay from scratch
          st.live = true;
          if (st.feed) st.feed.reset();
          openRunFeed(st);
        } else if (!live && st.live) {
          // the run just stopped; the server still owes this socket an `end`,
          // which is what closes the feed out.
          st.live = false;
        }
      }
      st.live = live;
      updateHeader(st);
      updateElapsed(st, Date.now());
    }
    // drop tiles for runs that vanished from the registry
    var gone = [];
    runs.forEach(function (st, id) { if (!seen.has(id)) gone.push(id); });
    for (var g = 0; g < gone.length; g++) {
      var st2 = runs.get(gone[g]);
      if (st2.pane || st2.ptyId) closeLive(st2);   // dispose pane + kill the PTY
      finishRun(st2);
      grid.removeChild(st2.dom.tile);
      runs.delete(gone[g]);
      if (selectedId === gone[g]) selectedId = null;
    }
    var emptyEl = document.getElementById("empty");
    if (runs.size === 0) {
      if (!emptyEl) {
        emptyEl = document.createElement("div");
        emptyEl.id = "empty";
        emptyEl.textContent = "no runs recorded — start one with agh run …";
        grid.appendChild(emptyEl);
      }
    } else if (emptyEl) {
      emptyEl.remove();
    }
    updateAggregates();
    reorder();
    if (selectedId) applySelection();
  }

  function select(id) {
    selectedId = (selectedId === id) ? null : id;
    applySelection();
  }

  function applySelection() {
    runs.forEach(function (st) {
      st.dom.tile.classList.toggle("selected", st.rec.runId === selectedId);
    });
  }

  function goTrio(runId) {
    var url = "/trio?run=" + encodeURIComponent(runId) +
      (TOKEN ? "&token=" + encodeURIComponent(TOKEN) : "");
    window.location.href = url;
  }

  // ------- runs socket with reconnect -------

  var runsSock = null;
  var runsBackoff = 1000;
  var runsTimer = null;

  function setWs(on) {
    elWs.textContent = on ? "● ws" : "○ ws";
    elWs.classList.toggle("on", !!on);
  }

  function connectRuns() {
    var sock;
    try {
      sock = new WebSocket(wsUrl("runs=1"));
    } catch (e) {
      scheduleRunsReconnect();
      return;
    }
    runsSock = sock;
    sock.onopen = function () {
      runsBackoff = 1000;
      setWs(true);
    };
    sock.onmessage = function (ev) {
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.type === "runs" && Array.isArray(msg.records)) handleRecords(msg.records);
    };
    sock.onclose = function () {
      runsSock = null;
      setWs(false);
      scheduleRunsReconnect();
    };
    sock.onerror = function () { try { sock.close(); } catch (e) { /* noop */ } };
  }

  function scheduleRunsReconnect() {
    if (runsTimer) return;
    runsTimer = window.setTimeout(function () {
      runsTimer = null;
      connectRuns();
    }, runsBackoff);
    runsBackoff = Math.min(30000, runsBackoff * 2);
  }

  // ------- 1s tick: clock, elapsed, liveness -------

  function tick() {
    var now = Date.now();
    var d = new Date(now);
    elClock.textContent = pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
    var liveChanged = false;
    runs.forEach(function (st) {
      updateElapsed(st, now);
      var live = isLive(st.rec, now);
      if (st.live && !live) {
        // heartbeat went stale without a registry write: degrade gracefully
        st.live = false;
        finishRun(st);
        updateHeader(st);
        liveChanged = true;
      }
    });
    if (liveChanged) { updateAggregates(); reorder(); }
  }

  // ------- boot -------

  function boot() {
    window.setInterval(tick, 1000);
    tick();
    connectRuns();
    // initial snapshot over HTTP; the socket refreshes it on open + changes
    fetch("/api/runs", { headers: { accept: "application/json" } })
      .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
      .then(function (data) { if (data && Array.isArray(data.records)) handleRecords(data.records); })
      .catch(function () {
        if (runs.size === 0) {
          var emptyEl = document.getElementById("empty") || null;
          if (!emptyEl) {
            emptyEl = document.createElement("div");
            emptyEl.id = "empty";
            grid.appendChild(emptyEl);
          }
          emptyEl.textContent = "waiting for runs… (api unreachable)";
        }
      });
  }

  boot();
})();
</script>
</body>
</html>
