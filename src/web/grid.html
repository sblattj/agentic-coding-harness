<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>agent-harness · grid</title>
<link rel="icon" href="data:,">
<style>
/* ===== theme: dark terminal, green-on-black ===== */
:root {
  --bg: #050806;
  --panel: #0a0f0c;
  --panel2: #0d1410;
  --edge: #1b2a21;
  --edge2: #27402f;
  --green: #3dff7c;
  --green2: #1fae5a;
  --text: #cdeedd;
  --dim: #7fa08d;
  --faint: #52695c;
  --cyan: #5bd7dd;
  --amber: #ffcf6b;
  --red: #ff6f6f;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.45 var(--mono);
}
::selection { background: rgba(61, 255, 124, .25); }

/* subtle CRT veil: static gradients only, no animation */
#fx {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 99;
  background:
    radial-gradient(120% 90% at 50% 0%, transparent 60%, rgba(0, 0, 0, .35)),
    repeating-linear-gradient(0deg, rgba(0, 0, 0, .14) 0 1px, transparent 1px 3px);
  opacity: .5;
}

.app { position: relative; min-height: 100vh; display: flex; flex-direction: column; }

/* ===== header ===== */
#hdr {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 14px;
  height: 46px;
  background: linear-gradient(180deg, #0c1310, #080d0a);
  border-bottom: 1px solid var(--edge);
}
.brand { display: flex; align-items: baseline; gap: 9px; white-space: nowrap; }
.glyph { color: var(--green); text-shadow: 0 0 10px rgba(61, 255, 124, .6); letter-spacing: -1px; }
.wordmark { font-weight: 700; letter-spacing: .14em; color: var(--text); text-shadow: 0 0 12px rgba(61, 255, 124, .28); }
.modelabel {
  font-size: 10px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: #04120a;
  background: var(--green);
  border-radius: 3px;
  padding: 2px 7px;
  font-weight: 700;
  box-shadow: 0 0 14px rgba(61, 255, 124, .35);
}
.hstats { display: flex; gap: 8px; flex: 1; min-width: 0; overflow: hidden; }
.pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 4px 10px;
  font-size: 11px;
  color: var(--dim);
  border: 1px solid var(--edge);
  border-radius: 3px;
  background: var(--panel);
  white-space: nowrap;
}
.pill b { color: var(--text); font-weight: 600; }
.pill.live b { color: var(--green); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
.dot.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.hctl { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.wspill { font-size: 11px; color: var(--faint); }
.wspill.on { color: var(--green2); }
.clock { color: var(--faint); font-size: 11px; }

/* ===== grid ===== */
main { flex: 1; display: block; }
#grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-auto-rows: minmax(250px, auto);
  gap: 10px;
  padding: 10px;
}
#empty {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 200px;
  color: var(--faint);
  padding: 20px;
  text-align: center;
}

/* ===== tile ===== */
.tile {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  cursor: pointer;
  background: var(--panel);
  border: 1px solid var(--edge);
  border-radius: 5px;
  overflow: hidden;
  box-shadow: inset 0 0 40px rgba(0, 0, 0, .35);
  transition: border-color .15s;
}
.tile:hover { border-color: var(--edge2); }
.tile.selected { border-color: var(--green2); box-shadow: 0 0 0 1px var(--green2), inset 0 0 40px rgba(0, 0, 0, .35); }
.tile:focus-visible, .trio:focus-visible { outline: 1px dashed var(--green); outline-offset: 2px; }

.tbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 10px;
  font-size: 11px;
  color: var(--dim);
  border-bottom: 1px solid var(--edge);
  background: #0b110e;
  white-space: nowrap;
  overflow: hidden;
}
.tbar .dot { flex: none; }
.tbar .dot.off { background: var(--faint); box-shadow: none; }
.tbar .dot.err { background: var(--red); box-shadow: 0 0 8px var(--red); }
.tname { color: var(--green); font-weight: 700; letter-spacing: .06em; }
.tname::before { content: "❯ "; color: var(--faint); font-weight: 400; }
.tmodel { color: var(--faint); font-size: 10px; overflow: hidden; text-overflow: ellipsis; }
.tspace { flex: 1; }
.tstat { color: var(--dim); }
.tstat b { color: var(--text); font-weight: 600; }
.tstat.cost b { color: var(--amber); }
.trio {
  flex: none;
  font: inherit;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 2px 7px;
  border: 1px solid var(--cyan);
  border-radius: 5px;
  background: transparent;
  color: var(--cyan);
  cursor: pointer;
  transition: background .15s, color .15s;
}
.trio:hover { background: var(--cyan); color: #000; }

.tbody {
  flex: 1;
  overflow-y: auto;
  padding: 8px 10px;
  font-size: 12px;
  line-height: 1.5;
  user-select: text;
  overscroll-behavior: contain;
}
.line { white-space: pre-wrap; word-break: break-word; color: var(--text); }
.line.typing::after { content: "▍"; color: var(--green); animation: blink .9s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.line.dim { color: var(--dim); }
.line.faint { color: var(--faint); font-style: italic; }
.line.ok { color: var(--green); }
.line.err { color: var(--red); }
.line.tool { color: var(--cyan); }
.tbody::-webkit-scrollbar { width: 8px; }
.tbody::-webkit-scrollbar-thumb { background: #1c2921; border-radius: 4px; }
.tbody::-webkit-scrollbar-track { background: transparent; }

/* ===== footer ===== */
#ftr {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  height: 28px;
  align-items: center;
  font-size: 10px;
  color: var(--faint);
  border-top: 1px solid var(--edge);
  background: #080d0a;
  white-space: nowrap;
  overflow: hidden;
}
#ftr .green { color: var(--green2); }

/* ===== responsive ===== */
@media (max-width: 860px) {
  #grid { grid-template-columns: minmax(0, 1fr); }
  #hdr { height: auto; flex-wrap: wrap; padding: 8px 12px; gap: 8px; }
  .hstats { order: 3; width: 100%; }
}

/* ===== reduced motion ===== */
@media (prefers-reduced-motion: reduce) {
  .dot.pulse { animation: none; }
  .line.typing::after { animation: none; content: ""; }
  .tile, .trio { transition: none; }
}
</style>
</head>
<body>
<div id="fx" aria-hidden="true"></div>
<div class="app">
  <header id="hdr">
    <div class="brand">
      <span class="glyph" aria-hidden="true">▚▞</span>
      <span class="wordmark">agent-harness</span>
      <span class="modelabel">grid</span>
    </div>
    <div class="hstats">
      <span class="pill live"><span class="dot pulse" aria-hidden="true"></span><b id="st-runs">0</b> runs live</span>
      <span class="pill"><b id="st-tok">0</b> tokens</span>
      <span class="pill"><b id="st-cost">$0.00</b> est. spend</span>
    </div>
    <div class="hctl">
      <span class="wspill" id="ws-state" title="runs socket">○ ws</span>
      <span class="clock" id="clock">--:--:--</span>
    </div>
  </header>

  <main>
    <div id="grid" role="group" aria-label="Agent terminal panes"></div>
  </main>

  <footer id="ftr">
    <span><span class="green">❯</span> click a tile to select · TRIO opens the detail view</span>
    <span>live = running + heartbeat &lt; 60s</span>
  </footer>
</div>

<script>
(function () {
  "use strict";

  var QS = new URLSearchParams(window.location.search);
  var TOKEN = QS.get("token") || "";
  var LIVE_MS = 60000;
  var MAX_LINES = 80;
  var REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var grid = document.getElementById("grid");
  var elRuns = document.getElementById("st-runs");
  var elTok = document.getElementById("st-tok");
  var elCost = document.getElementById("st-cost");
  var elClock = document.getElementById("clock");
  var elWs = document.getElementById("ws-state");

  // runId -> state object
  var runs = new Map();
  var selectedId = null;
  var lastOrder = "";

  function wsUrl(query) {
    var proto = window.location.protocol === "https:" ? "wss:" : "ws:";
    return proto + "//" + window.location.host + "/ws?" + query +
      (TOKEN ? "&token=" + encodeURIComponent(TOKEN) : "");
  }

  function isLive(rec, now) {
    return rec.status === "running" && (now - rec.updatedAt) < LIVE_MS;
  }

  function fmtTok(n) {
    if (!isFinite(n)) return "0";
    if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
    return String(n);
  }

  function tokensOf(rec) {
    var t = rec && rec.totals ? rec.totals : null;
    if (!t) return 0;
    return (t.inputTokens || 0) + (t.outputTokens || 0) + (t.cacheReadTokens || 0) + (t.cacheWriteTokens || 0);
  }

  function fmtDur(ms) {
    if (!isFinite(ms) || ms < 0) ms = 0;
    var s = Math.floor(ms / 1000);
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var sec = s % 60;
    if (h > 0) return h + "h" + (m < 10 ? "0" : "") + m + "m";
    if (m > 0) return m + "m" + (sec < 10 ? "0" : "") + sec + "s";
    return sec + "s";
  }

  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  // ------- tile DOM -------

  function makeTile(rec) {
    var tile = document.createElement("section");
    tile.className = "tile";
    tile.setAttribute("role", "button");
    tile.setAttribute("tabindex", "0");
    tile.setAttribute("aria-label", "run " + rec.agent);

    var bar = document.createElement("div");
    bar.className = "tbar";
    var dot = document.createElement("span");
    dot.className = "dot";
    var name = document.createElement("span");
    name.className = "tname";
    var model = document.createElement("span");
    model.className = "tmodel";
    var space = document.createElement("span");
    space.className = "tspace";
    var trio = document.createElement("button");
    trio.className = "trio";
    trio.type = "button";
    trio.textContent = "TRIO ➜";
    var tok = document.createElement("span");
    tok.className = "tstat";
    var cost = document.createElement("span");
    cost.className = "tstat cost";
    var elapsed = document.createElement("span");
    elapsed.className = "tstat";
    bar.appendChild(dot);
    bar.appendChild(name);
    bar.appendChild(model);
    bar.appendChild(space);
    bar.appendChild(trio);
    bar.appendChild(tok);
    bar.appendChild(cost);
    bar.appendChild(elapsed);

    var body = document.createElement("div");
    body.className = "tbody";

    tile.appendChild(bar);
    tile.appendChild(body);

    return { tile: tile, dot: dot, name: name, model: model, trio: trio, tok: tok, cost: cost, elapsed: elapsed, body: body };
  }

  function statusLabel(st, live) {
    if (st === "running" && !live) return "interrupted";
    return st;
  }

  function classify(text) {
    var t = text || "";
    if (/^\s*[✓✔ok]/i.test(t) || /passed\b/i.test(t)) return "line ok";
    if (/^\s*[✗✖x]/i.test(t) || /\berror\b|\bfail(ed|ure)?\b/i.test(t)) return "line err";
    if (/^\s*(⏺|⏿|●)/.test(t) || /^\s*\[(tool|bash|read|edit|write|search)\b/i.test(t)) return "line tool";
    return "line";
  }

  function appendLine(st, text, cls) {
    var body = st.dom.body;
    var div = document.createElement("div");
    div.className = cls || classify(text);
    div.textContent = text; // escaped by construction
    // typewriter caret on the newest live line (motion-safe only)
    if (!REDUCED && st.streaming && st.typingEl) st.typingEl.classList.remove("typing");
    if (!REDUCED && st.streaming) {
      div.classList.add("typing");
      st.typingEl = div;
    }
    // auto-scroll only when the user is parked at (or near) the bottom
    var near = body.scrollHeight - body.scrollTop - body.clientHeight < 48;
    body.appendChild(div);
    while (body.childElementCount > MAX_LINES) body.removeChild(body.firstChild);
    if (near) body.scrollTop = body.scrollHeight;
  }

  function setSummary(st) {
    var rec = st.rec;
    st.dom.body.textContent = "";
    st.typingEl = null;
    appendLine(st, "❯ " + (rec.promptPreview || "(no prompt)"), "line dim");
    var label = statusLabel(rec.status, st.live);
    var cls = label === "success" ? "line ok" : label === "error" ? "line err" : "line faint";
    appendLine(st, "— " + label.toUpperCase() + " —", cls);
    if (rec.lastEvent) appendLine(st, rec.lastEvent, "line dim");
  }

  function updateHeader(st) {
    var rec = st.rec;
    var live = st.live;
    var d = st.dom.dot;
    d.className = "dot" + (live ? " pulse" : rec.status === "error" ? " err" : " off");
    st.dom.name.textContent = rec.agent || "unknown";
    var idText = rec.sessionId ? rec.sessionId : rec.runId;
    st.dom.model.textContent = String(idText || "").slice(0, 12);
    st.dom.tok.textContent = "";
    var bTok = document.createElement("b");
    bTok.textContent = fmtTok(tokensOf(rec));
    st.dom.tok.appendChild(document.createTextNode("tok "));
    st.dom.tok.appendChild(bTok);
    st.dom.cost.textContent = "";
    var bCost = document.createElement("b");
    bCost.textContent = "$" + (rec.totals && rec.totals.costUsd ? rec.totals.costUsd.toFixed(2) : "0.00");
    st.dom.cost.appendChild(document.createTextNode("cost "));
    st.dom.cost.appendChild(bCost);
    st.dom.tile.setAttribute("aria-label", "run " + (rec.agent || "?") + " " + statusLabel(rec.status, live));
  }

  function updateElapsed(st, now) {
    var rec = st.rec;
    var end = st.live ? now : rec.updatedAt;
    st.dom.elapsed.textContent = "";
    var b = document.createElement("b");
    b.textContent = fmtDur(end - rec.startedAt);
    st.dom.elapsed.appendChild(b);
  }

  // ------- per-run live stream -------

  function openRunSocket(st) {
    if (st.ended || st.sock) return;
    st.streaming = true;
    appendLine(st, "— connecting to stream —", "line faint");
    var sock;
    try {
      sock = new WebSocket(wsUrl("runId=" + encodeURIComponent(st.rec.runId)));
    } catch (e) {
      st.streaming = false;
      return;
    }
    st.sock = sock;
    sock.onmessage = function (ev) {
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.type === "record" && msg.record) {
        st.rec = msg.record;
        st.live = isLive(st.rec, Date.now());
        updateHeader(st);
        updateElapsed(st, Date.now());
        return;
      }
      if (msg.type === "backlog" && Array.isArray(msg.events)) {
        st.dom.body.textContent = "";
        st.typingEl = null;
        var events = msg.events.length > MAX_LINES ? msg.events.slice(msg.events.length - MAX_LINES) : msg.events;
        for (var i = 0; i < events.length; i++) {
          var text = events[i] && (events[i].text || (events[i].event && events[i].event.text));
          if (typeof text === "string" && text.length > 0) appendLine(st, text);
        }
        st.dom.body.scrollTop = st.dom.body.scrollHeight;
        return;
      }
      if (msg.type === "event") {
        var t = msg.text || (msg.event && msg.event.text);
        if (typeof t === "string" && t.length > 0) appendLine(st, t);
        return;
      }
      if (msg.type === "end") {
        finishRun(st, "— stream ended —");
      }
    };
    sock.onclose = function () {
      st.sock = null;
      st.streaming = false;
      if (st.typingEl) { st.typingEl.classList.remove("typing"); st.typingEl = null; }
      if (!st.ended && isLive(st.rec, Date.now())) {
        // transient drop while the run is still live: retry with backoff
        st.backoff = Math.min(15000, (st.backoff || 1000) * 2);
        st.reconnectTimer = window.setTimeout(function () {
          st.reconnectTimer = null;
          if (!st.ended && isLive(st.rec, Date.now())) openRunSocket(st);
        }, st.backoff);
      }
    };
    sock.onerror = function () { try { sock.close(); } catch (e) { /* noop */ } };
  }

  function finishRun(st, note) {
    if (st.ended && note === undefined) return;
    st.ended = true;
    st.streaming = false;
    if (st.reconnectTimer) { window.clearTimeout(st.reconnectTimer); st.reconnectTimer = null; }
    if (st.sock) { try { st.sock.close(); } catch (e) { /* noop */ } st.sock = null; }
    if (st.typingEl) { st.typingEl.classList.remove("typing"); st.typingEl = null; }
    if (note) appendLine(st, note, "line faint");
  }

  // ------- runs list -------

  function sortIds() {
    var ids = Array.from(runs.keys());
    var now = Date.now();
    ids.sort(function (a, b) {
      var ra = runs.get(a).rec, rb = runs.get(b).rec;
      var la = isLive(ra, now) ? 0 : 1;
      var lb = isLive(rb, now) ? 0 : 1;
      if (la !== lb) return la - lb;
      return rb.startedAt - ra.startedAt;
    });
    return ids;
  }

  function reorder() {
    var ids = sortIds();
    var sig = ids.join(",");
    if (sig !== lastOrder) {
      lastOrder = sig;
      for (var i = 0; i < ids.length; i++) {
        var st = runs.get(ids[i]);
        grid.appendChild(st.dom.tile); // appendChild moves existing nodes in order
      }
    }
  }

  function updateAggregates() {
    var now = Date.now();
    var live = 0, tok = 0, cost = 0;
    runs.forEach(function (st) {
      if (isLive(st.rec, now)) live++;
      tok += tokensOf(st.rec);
      cost += (st.rec.totals && st.rec.totals.costUsd) || 0;
    });
    elRuns.textContent = String(live);
    elTok.textContent = fmtTok(tok);
    elCost.textContent = "$" + cost.toFixed(2);
  }

  function handleRecords(records) {
    if (!Array.isArray(records)) return;
    var seen = new Set();
    for (var i = 0; i < records.length; i++) {
      var rec = records[i];
      if (!rec || typeof rec.runId !== "string") continue;
      seen.add(rec.runId);
      var st = runs.get(rec.runId);
      var live = isLive(rec, Date.now());
      if (!st) {
        var dom = makeTile(rec);
        st = {
          rec: rec, live: live, ended: !live, streaming: false,
          sock: null, backoff: 1000, reconnectTimer: null, typingEl: null, dom: dom
        };
        (function (state) {
          state.dom.tile.addEventListener("click", function () { select(state.rec.runId); });
          state.dom.tile.addEventListener("keydown", function (ev) {
            if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(state.rec.runId); }
          });
          state.dom.trio.addEventListener("click", function (ev) {
            ev.stopPropagation();
            goTrio(state.rec.runId);
          });
        })(st);
        runs.set(rec.runId, st);
        grid.appendChild(dom.tile);
        if (live) {
          st.ended = false;
          appendLine(st, "❯ " + (rec.promptPreview || "(no prompt)"), "line dim");
          openRunSocket(st);
        } else {
          setSummary(st);
        }
      } else {
        st.rec = rec;
        if (live && !st.live) {
          // transitioned to live (e.g. heartbeat resumed)
          st.live = true;
          st.ended = false;
          st.dom.body.textContent = "";
          st.typingEl = null;
          appendLine(st, "❯ " + (rec.promptPreview || "(no prompt)"), "line dim");
          openRunSocket(st);
        } else if (!live && st.live) {
          st.live = false;
          finishRun(st, "— stream ended —");
          if (st.rec.status === "running") setSummary(st);
        }
      }
      st.live = live;
      updateHeader(st);
      updateElapsed(st, Date.now());
    }
    // drop tiles for runs that vanished from the registry
    var gone = [];
    runs.forEach(function (st, id) { if (!seen.has(id)) gone.push(id); });
    for (var g = 0; g < gone.length; g++) {
      var st2 = runs.get(gone[g]);
      finishRun(st2);
      grid.removeChild(st2.dom.tile);
      runs.delete(gone[g]);
      if (selectedId === gone[g]) selectedId = null;
    }
    var emptyEl = document.getElementById("empty");
    if (runs.size === 0) {
      if (!emptyEl) {
        emptyEl = document.createElement("div");
        emptyEl.id = "empty";
        emptyEl.textContent = "no runs recorded — start one with agh run …";
        grid.appendChild(emptyEl);
      }
    } else if (emptyEl) {
      emptyEl.remove();
    }
    updateAggregates();
    reorder();
    if (selectedId) applySelection();
  }

  function select(id) {
    selectedId = (selectedId === id) ? null : id;
    applySelection();
  }

  function applySelection() {
    runs.forEach(function (st) {
      st.dom.tile.classList.toggle("selected", st.rec.runId === selectedId);
    });
  }

  function goTrio(runId) {
    var url = "/trio?run=" + encodeURIComponent(runId) +
      (TOKEN ? "&token=" + encodeURIComponent(TOKEN) : "");
    window.location.href = url;
  }

  // ------- runs socket with reconnect -------

  var runsSock = null;
  var runsBackoff = 1000;
  var runsTimer = null;

  function setWs(on) {
    elWs.textContent = on ? "● ws" : "○ ws";
    elWs.classList.toggle("on", !!on);
  }

  function connectRuns() {
    var sock;
    try {
      sock = new WebSocket(wsUrl("runs=1"));
    } catch (e) {
      scheduleRunsReconnect();
      return;
    }
    runsSock = sock;
    sock.onopen = function () {
      runsBackoff = 1000;
      setWs(true);
    };
    sock.onmessage = function (ev) {
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.type === "runs" && Array.isArray(msg.records)) handleRecords(msg.records);
    };
    sock.onclose = function () {
      runsSock = null;
      setWs(false);
      scheduleRunsReconnect();
    };
    sock.onerror = function () { try { sock.close(); } catch (e) { /* noop */ } };
  }

  function scheduleRunsReconnect() {
    if (runsTimer) return;
    runsTimer = window.setTimeout(function () {
      runsTimer = null;
      connectRuns();
    }, runsBackoff);
    runsBackoff = Math.min(30000, runsBackoff * 2);
  }

  // ------- 1s tick: clock, elapsed, liveness -------

  function tick() {
    var now = Date.now();
    var d = new Date(now);
    elClock.textContent = pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
    var liveChanged = false;
    runs.forEach(function (st) {
      updateElapsed(st, now);
      var live = isLive(st.rec, now);
      if (st.live && !live) {
        // heartbeat went stale without a registry write: degrade gracefully
        st.live = false;
        finishRun(st, "— stream ended —");
        if (st.rec.status === "running") setSummary(st);
        liveChanged = true;
      }
    });
    if (liveChanged) { updateAggregates(); reorder(); }
  }

  // ------- boot -------

  function boot() {
    window.setInterval(tick, 1000);
    tick();
    connectRuns();
    // initial snapshot over HTTP; the socket refreshes it on open + changes
    fetch("/api/runs", { headers: { accept: "application/json" } })
      .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
      .then(function (data) { if (data && Array.isArray(data.records)) handleRecords(data.records); })
      .catch(function () {
        if (runs.size === 0) {
          var emptyEl = document.getElementById("empty") || null;
          if (!emptyEl) {
            emptyEl = document.createElement("div");
            emptyEl.id = "empty";
            grid.appendChild(emptyEl);
          }
          emptyEl.textContent = "waiting for runs… (api unreachable)";
        }
      });
  }

  boot();
})();
</script>
