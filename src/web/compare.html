<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>agentic-coding-harness · compare</title>
<link rel="icon" href="data:,">
<style>
/* ===== theme: dark terminal, green-on-black (matches /grid) ===== */
:root {
  --bg: #050806;
  --panel: #0a0f0c;
  --panel2: #0d1410;
  --edge: #1b2a21;
  --edge2: #27402f;
  --green: #3dff7c;
  --green2: #1fae5a;
  --text: #cdeedd;
  --dim: #7fa08d;
  --faint: #52695c;
  --cyan: #5bd7dd;
  --amber: #ffcf6b;
  --red: #ff6f6f;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.45 var(--mono);
}
::selection { background: rgba(61, 255, 124, .25); }

#fx {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 99;
  background:
    radial-gradient(120% 90% at 50% 0%, transparent 60%, rgba(0, 0, 0, .35)),
    repeating-linear-gradient(0deg, rgba(0, 0, 0, .14) 0 1px, transparent 1px 3px);
  opacity: .5;
}
.app { position: relative; min-height: 100vh; display: flex; flex-direction: column; }

/* ===== header ===== */
#hdr {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 14px;
  height: 46px;
  background: linear-gradient(180deg, #0c1310, #080d0a);
  border-bottom: 1px solid var(--edge);
}
.brand { display: flex; align-items: baseline; gap: 9px; white-space: nowrap; }
.glyph { color: var(--green); text-shadow: 0 0 10px rgba(61, 255, 124, .6); letter-spacing: -1px; }
.wordmark { font-weight: 700; letter-spacing: .14em; color: var(--text); text-shadow: 0 0 12px rgba(61, 255, 124, .28); }
.modelabel {
  font-size: 10px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: #04120a;
  background: var(--green);
  border-radius: 3px;
  padding: 2px 7px;
  font-weight: 700;
  box-shadow: 0 0 14px rgba(61, 255, 124, .35);
}
.pagenav { display: flex; gap: 2px; white-space: nowrap; }
.pagenav a {
  color: var(--dim);
  text-decoration: none;
  font-size: 11px;
  letter-spacing: .06em;
  padding: 2px 8px;
  border: 1px solid transparent;
  border-radius: 3px;
}
.pagenav a:hover { color: var(--text); border-color: var(--edge); }
.pagenav a.active { color: var(--green); border-color: var(--green2); }
.hstats { display: flex; gap: 8px; flex: 1; min-width: 0; overflow: hidden; }
.pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 4px 10px;
  font-size: 11px;
  color: var(--dim);
  border: 1px solid var(--edge);
  border-radius: 3px;
  background: var(--panel);
  white-space: nowrap;
}
.pill b { color: var(--text); font-weight: 600; }

/* ===== tables ===== */
main { flex: 1; display: block; padding: 14px; display: flex; flex-direction: column; gap: 18px; }
section.tbl { background: var(--panel); border: 1px solid var(--edge); border-radius: 5px; overflow: hidden; box-shadow: inset 0 0 40px rgba(0, 0, 0, .35); }
section.tbl h2 {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--dim);
  padding: 8px 12px;
  border-bottom: 1px solid var(--edge);
  background: #0b110e;
}
section.tbl h2 b { color: var(--green); }
.tblwrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { padding: 6px 12px; text-align: left; border-bottom: 1px solid var(--edge); white-space: nowrap; }
thead th {
  position: sticky;
  top: 0;
  background: var(--panel2);
  color: var(--dim);
  font-size: 10.5px;
  letter-spacing: .1em;
  text-transform: uppercase;
  cursor: pointer;
  user-select: none;
}
thead th:hover { color: var(--text); }
thead th .dir { color: var(--green); margin-left: 5px; }
tbody tr:hover { background: var(--panel2); }
tbody tr:last-child td { border-bottom: 0; }
td.group { color: var(--text); max-width: 30ch; overflow: hidden; text-overflow: ellipsis; }
td.group .unset { color: var(--faint); }
td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }
td.num.cost { color: var(--amber); }
td.num.succ { color: var(--cyan); }
.msg { color: var(--faint); padding: 14px 12px; }
.msg.err { color: var(--red); }

/* ===== footer ===== */
#ftr {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  height: 28px;
  align-items: center;
  font-size: 10px;
  color: var(--faint);
  border-top: 1px solid var(--edge);
  background: #080d0a;
  white-space: nowrap;
  overflow: hidden;
}
#ftr .green { color: var(--green2); }

@media (max-width: 860px) {
  #hdr { height: auto; flex-wrap: wrap; padding: 8px 12px; gap: 8px; }
  .hstats { order: 3; width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="fx" aria-hidden="true"></div>
<div class="app">
  <header id="hdr">
    <div class="brand">
      <span class="glyph" aria-hidden="true">▚▞</span>
      <span class="wordmark">agentic-coding-harness</span>
      <span class="modelabel">compare</span>
    </div>
    <nav class="pagenav" aria-label="pages">
      <a data-nav="grid" href="/grid">grid</a>
      <a data-nav="compare" class="active" href="/compare">compare</a>
      <a data-nav="observability" href="/trio">observability</a>
    </nav>
    <div class="hstats">
      <span class="pill"><b id="agg">–</b></span>
    </div>
  </header>

  <main>
    <section class="tbl" aria-label="experiments by variant">
      <h2><b>❯</b> experiments × variants</h2>
      <div class="tblwrap">
        <table id="expTable">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="msg" id="expMsg">loading…</div>
    </section>

    <section class="tbl" aria-label="workflows by agent">
      <h2><b>❯</b> workflows</h2>
      <div class="tblwrap">
        <table id="wfTable">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="msg" id="wfMsg">loading…</div>
    </section>
  </main>

  <footer id="ftr">
    <span><span class="green">❯</span> click a column header to sort · click again to reverse · third click restores group order</span>
    <span>grouped rollups from /api/compare</span>
  </footer>
</div>

<script>
(function () {
  "use strict";

  var QS = new URLSearchParams(window.location.search);
  var TOKEN = QS.get("token") || "";

  // nav links keep the session token when one is in play
  (function () {
    var qs = TOKEN ? "?token=" + encodeURIComponent(TOKEN) : "";
    var links = document.querySelectorAll(".pagenav a");
    for (var i = 0; i < links.length; i++) links[i].href += qs;
  })();

  /* ===== formatters ===== */
  function fmtTok(n) {
    n = Number(n) || 0;
    if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
    return String(Math.round(n));
  }
  function fmtCost(n) { return "$" + (Number(n) || 0).toFixed(4); }
  function fmtDur(ms) {
    ms = Number(ms) || 0;
    return ms >= 1000 ? (ms / 1000).toFixed(2) + "s" : Math.round(ms) + "ms";
  }
  function fmtPct(n) { return ((Number(n) || 0) * 100).toFixed(1) + "%"; }

  /* ===== table machinery ===== */
  var METRIC_COLS = ["runs", "avgTotalTokens", "avgCostUsd", "avgDurationMs", "successRate"];
  var LABELS = {
    experiment: "experiment", variant: "variant", workflow: "workflow", agent: "agent",
    runs: "runs", avgTotalTokens: "avg tokens", avgCostUsd: "avg cost",
    avgDurationMs: "avg duration", successRate: "success",
  };

  // per-table state: rows in group order + current sort (null | key+dir)
  var stores = {};

  function isMetric(key) { return METRIC_COLS.indexOf(key) !== -1; }

  function sortedRows(store) {
    var s = store.sort;
    if (!s || !s.key) return store.rows;
    var rows = store.rows.slice();
    var key = s.key;
    rows.sort(function (a, b) {
      var r;
      if (isMetric(key)) r = (Number(a[key]) || 0) - (Number(b[key]) || 0);
      else r = String(a[key] ?? "").localeCompare(String(b[key] ?? ""));
      return s.dir * r;
    });
    return rows;
  }

  function renderTable(store) {
    var headRow = document.createElement("tr");
    var cols = store.groupBy.concat(METRIC_COLS);
    for (var c = 0; c < cols.length; c++) {
      (function (key) {
        var th = document.createElement("th");
        th.setAttribute("role", "columnheader");
        th.setAttribute("aria-sort",
          store.sort && store.sort.key === key
            ? (store.sort.dir < 0 ? "descending" : "ascending")
            : "none");
        th.appendChild(document.createTextNode(LABELS[key] || key));
        var s = store.sort && store.sort.key === key ? store.sort : null;
        if (s) {
          var g = document.createElement("span");
          g.className = "dir";
          g.textContent = s.dir < 0 ? "▼" : "▲";
          th.appendChild(g);
        }
        th.addEventListener("click", function () {
          var cur = store.sort;
          if (!cur || cur.key !== key) store.sort = { key: key, dir: -1 };       // desc first
          else if (cur.dir < 0) store.sort = { key: key, dir: 1 };               // then asc
          else store.sort = null;                                                // then group order
          renderTable(store);
        });
        headRow.appendChild(th);
      })(cols[c]);
    }
    store.head.textContent = "";
    store.head.appendChild(headRow);

    store.body.textContent = "";
    var rows = sortedRows(store);
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      var tr = document.createElement("tr");
      for (var g = 0; g < store.groupBy.length; g++) {
        var td = document.createElement("td");
        td.className = "group";
        var v = row[store.groupBy[g]];
        if (v === null || v === undefined || v === "") {
          var un = document.createElement("span");
          un.className = "unset";
          un.textContent = "–";
          td.appendChild(un);
        } else {
          td.textContent = String(v);
        }
        tr.appendChild(td);
      }
      var cells = [
        ["runs", "", fmtTok],
        ["avgTotalTokens", "", fmtTok],
        ["avgCostUsd", "cost", fmtCost],
        ["avgDurationMs", "", fmtDur],
        ["successRate", "succ", fmtPct],
      ];
      for (var m = 0; m < cells.length; m++) {
        var nd = document.createElement("td");
        nd.className = "num" + (cells[m][1] ? " " + cells[m][1] : "");
        nd.textContent = cells[m][2](row[cells[m][0]]);
        tr.appendChild(nd);
      }
      store.body.appendChild(tr);
    }
  }

  function updateAgg() {
    var totalRuns = 0, groups = 0;
    Object.keys(stores).forEach(function (k) {
      if (!stores[k].loaded) return;
      stores[k].rows.forEach(function (r) { totalRuns += Number(r.runs) || 0; });
      groups += stores[k].rows.length;
    });
    var agg = document.getElementById("agg");
    agg.textContent = totalRuns + " runs · " + groups + " groups";
  }

  function fetchCompare(path) {
    var url = path + (TOKEN ? "?token=" + encodeURIComponent(TOKEN) : "");
    var headers = { accept: "application/json" };
    if (TOKEN) headers.authorization = "Bearer " + TOKEN;
    return fetch(url, { headers: headers }).then(function (r) {
      if (!r.ok) throw new Error("http " + r.status);
      return r.json();
    });
  }

  function loadTable(name, path, tableId, msgId) {
    var msg = document.getElementById(msgId);
    var store = {
      loaded: false, rows: [], groupBy: [], sort: null,
      head: document.querySelector("#" + tableId + " thead"),
      body: document.querySelector("#" + tableId + " tbody"),
    };
    stores[name] = store;
    fetchCompare(path)
      .then(function (data) {
        if (!data || !Array.isArray(data.groupBy) || !Array.isArray(data.rows)) {
          throw new Error("unexpected payload shape");
        }
        store.groupBy = data.groupBy;
        store.rows = data.rows;
        store.loaded = true;
        msg.textContent = "";
        msg.classList.remove("err");
        if (data.rows.length === 0) msg.textContent = "no runs to compare yet";
        renderTable(store);
        updateAgg();
      })
      .catch(function (err) {
        msg.textContent = "compare unavailable: " +
          (err && err.message ? err.message : String(err));
        msg.classList.add("err");
      });
  }

  loadTable("exp", "/api/compare?by=experiment,variant", "expTable", "expMsg");
  loadTable("wf", "/api/compare?by=workflow,agent", "wfTable", "wfMsg");
})();
</script>
</body>
</html>
