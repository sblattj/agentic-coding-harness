<!doctype html>
<!--
  CONCEPT A: Observability Trio
  - Thesis: three probes onto one run, sharing a single selection. WHERE time went (traces), WHAT it consumed (metrics), WHAT it said ( logs). A click on any span explains itself across all three panes at once.
  - Traces pane maps to OTel gen_ai spans: nested model_call / tool_call with start offsets and durations; bar position is span start vs run start, width is duration.
  - Metrics map to CanonicalTokenRecord aggregates: input / output / cacheRead / cacheWrite priced per MTok ($3 / $15 / $0.30 / $3.75); the series is normalized so its integral equals the run's exact token total and cost.
  - Logs map to the AgentEvent stream (step / tool / usage / error kinds) with severity colors; the bottom drawer maps to the recorded pty stream, replayed as an interactive fake shell.
-->

const state={i:0,sel:null};
let tick=null,tk=0,cur=null;

function usage(run){const u={in:0,out:0,cr:0,cw:0};(function w(sp){for(const s of sp){if(s[4]){u.in+=s[4].in;u.out+=s[4].out;u.cr+=s[4].cr;u.cw+=s[4].cw}w(s[5])}})(run.spans);return u}
function costOf(u){return u.in*PRICES.in/1e6+u.out*PRICES.out/1e6+u.cr*PRICES.cr/1e6+u.cw*PRICES.cw/1e6}
function flat(sp,d,out){d=d||0;out=out||[];for(const s of sp){out.push({s:s,d:d});flat(s[5],d+1,out)}return out}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return h}
function series(run){
 const u=usage(run),tot=u.in+u.out+u.cr+u.cw,cost=costOf(u),N=48,dt=run.dur/N;
 const models=[];(function w(sp){for(const s of sp){if(s[1]==='model')models.push(s);w(s[5])}})(run.spans);
 const rnd=mulberry(hash(run.id));const v=[];
 for(let i=0;i<N;i++){const t=i*dt+dt/2;let r=0.04*tot/run.dur*1000;
  for(const m of models){if(t>=m[2]&&t<m[2]+m[3]){r=(m[4].in+m[4].out+m[4].cr+m[4].cw)/m[3]*1000;break}}
  v.push(r*(0.82+0.36*rnd()))}
 const sum=v.reduce((a,b)=>a+b,0),sc=sum*dt/1000>0?tot/(sum*dt/1000):1;
 return{tok:v.map(x=>x*sc),usd:v.map(x=>x*sc*cost/tot),dt:dt}}

function geom(sr){const W=640,H=176,N=sr.tok.length;
 const mx=Math.max(...sr.tok)*1.15,mu=Math.max(...sr.usd)*1.18;
 const pts=(a,m)=>a.map((x,i)=>(i/(N-1)*W).toFixed(1)+','+(H-4-x/m*(H-16)).toFixed(1)).join(' ');
 return{W:W,H:H,mx:mx,pt:pts(sr.tok,mx),pu:pts(sr.usd,mu)}}

function drawChart(run,anim){
 const sr=series(run),g=geom(sr);cur={sr:sr,g:g};
 const W=g.W,H=g.H;let grid='';
 for(let i=1;i<4;i++)grid+='<line class="grid" x1="0" x2="'+W+'" y1="'+(H-4-(H-16)*i/4).toFixed(1)+'" y2="'+(H-4-(H-16)*i/4).toFixed(1)+'"/>';
 let band='';
 if(state.sel){const rows=flat(run.spans).filter(r=>r.s[0]===state.sel);
  if(rows.length){const s=rows[0].s,maxEnd=run.dur,l=s[2]/maxEnd*100,w=Math.max(s[3]/maxEnd*100,.5);
   band='<rect class="band" x="'+(l/100*W).toFixed(1)+'" y="0" width="'+(w/100*W).toFixed(1)+'" height="'+H+'"/>'}}
 const ch=$('chart');ch.classList.toggle('still',!anim);
 ch.innerHTML=grid+band+
  '<polygon class="area" points="'+g.pt+' '+W+','+H+' 0,'+H+'"/>'+
  '<polyline class="line l-t" points="'+g.pt+'" vector-effect="non-scaling-stroke"/>'+
  '<polyline class="line l-u" points="'+g.pu+'" vector-effect="non-scaling-stroke"/>'+
  '<g class="xh"><line x1="0" x2="0" y1="0" y2="'+H+'"/><circle class="ct" r="3.2"/><circle class="cu" r="3.2"/></g>';
 $('ax0').textContent=K(g.mx);$('ax1').textContent=K(g.mx/2);
 $('axT').innerHTML='<span>0s</span><span>'+S(run.dur/2)+'</span><span>'+S(run.dur)+'</span>';
 $('tip').style.display='none'}

function updateChart(){if(!cur)return;const sr=cur.sr,g=geom(sr),ch=$('chart'),H=176;
 ch.querySelector('.l-t').setAttribute('points',g.pt);
 ch.querySelector('.l-u').setAttribute('points',g.pu);
 ch.querySelector('.area').setAttribute('points',g.pt+' 640,'+H+' 0,'+H);
 $('ax0').textContent=K(g.mx);$('ax1').textContent=K(g.mx/2)}

function renderMetrics(run){
 const u=usage(run),c=costOf(u),tot=u.in+u.out+u.cr+u.cw,spans=flat(run.spans).length;
 $('stats').innerHTML=[['input',K(u.in),'c-in'],['output',K(u.out),'c-out'],['cache read',K(u.cr),'c-cr'],
  ['cache write',K(u.cw),'c-cw'],['cost',USD(c),'c-cost'],['elapsed',S(run.dur),'c-el']]
  .map(x=>'<div class="stat"><div class="k">'+x[0]+'</div><div class="v '+x[2]+'">'+x[1]+'</div></div>').join('');
 $('chartMeta').textContent=K(tot)+' tok · avg '+K(tot/(run.dur/1000))+' tok/s · '+USD(c/(run.dur/1000))+'/s · '+spans+' spans';
 drawChart(run,true)}

function renderTraces(run){
 const rows=flat(run.spans),maxEnd=run.dur;
 $('traceMeta').textContent=rows.length+' spans · '+S(maxEnd);
 $('traceList').innerHTML=rows.map(r=>{
  const s=r.s,l=(s[2]/maxEnd*100).toFixed(2),w=Math.max(s[3]/maxEnd*100,.4);
  return '<div class="span k-'+s[1]+(state.sel===s[0]?' sel':'')+'" data-n="'+esc(s[0])+'" role="button" tabindex="0" aria-pressed="'+(state.sel===s[0])+'">'+
   '<span class="lbl" style="padding-left:'+(r.d*13)+'px"><i class="kd"></i>'+esc(s[0])+' <em>'+s[3]+'ms</em></span>'+
   '<span class="bar"><i style="left:'+l+'%;width:'+w+'%"></i></span></div>'}).join('')}

function logRow(l,hit){return '<div class="log"><span class="ts">+'+(l[0]/1000).toFixed(3)+'s</span><span class="lv lv-'+l[1]+'">'+l[1]+'</span><span class="sp'+(hit?' hit':'')+'">'+esc(l[2])+'</span><span class="m">'+esc(l[3])+'</span></div>'}
function renderLogs(run){
 const rows=state.sel?run.logs.filter(l=>l[2]===state.sel):run.logs;
 $('logMeta').textContent=rows.length+' / '+run.logs.length+' lines';
 $('logFilter').hidden=!state.sel;
 if(state.sel)$('logFilter').textContent='filter: '+state.sel+'  ✕';
 $('logFilter').style.marginLeft=state.sel?'':'auto';
 const el=$('logList');el.innerHTML=rows.map(l=>logRow(l,state.sel===l[2])).join('');
 el.scrollTop=el.scrollHeight}

function renderTabs(){
 $('tabs').innerHTML=RUNS.map((r,i)=>'<button class="tab" data-i="'+i+'" aria-pressed="'+(i===state.i)+'"><i class="dot st-'+r.status+'"></i><b>'+r.agent+'</b><span class="rid">'+r.id+'</span></button>').join('')}

function pulse(run){const p=$('pulse');
 p.classList.toggle('on',run.status==='running');
 $('pulseTxt').textContent=run.status==='running'?'LIVE · '+S(run.dur):run.status.toUpperCase()}

function termPrint(t,cls){const d=document.createElement('div');d.className='tl '+(cls||'dim');d.textContent=t;$('termOut').appendChild(d);$('termOut').scrollTop=1e9}
function promptOf(run){return 'harness:/runs/'+run.id+' $'}
function termAttach(run){
 $('termPrompt').textContent=promptOf(run);
 $('termMeta').textContent=run.agent+' · '+run.model+' · pty replay';
 termPrint('attach '+run.id+' ('+run.agent+' / '+run.model+') · type \'help\'','dim')}

const CMDS={
 help:()=>[['commands: status · tokens · cost · spans · logs · clear','dim']],
 status:r=>[[r.id+' · '+r.agent+' / '+r.model+' · '+r.status+' · '+S(r.dur)+' · '+USD(costOf(usage(r))),'pri']],
 tokens:r=>{const u=usage(r),t=u.in+u.out+u.cr+u.cw;
  return[['in '+K(u.in)+' · out '+K(u.out),'pri'],['cacheRead '+K(u.cr)+' · cacheWrite '+K(u.cw),'pri'],['total '+K(t)+' tokens','dim']]},
 cost:r=>{const lines=flat(r.spans).filter(x=>x.s[1]==='model'&&x.s[4]).map(x=>[x.s[0].replace('model_call · ','')+': '+USD(costOf(x.s[4])),'ok']);
  return lines.concat([['total '+USD(costOf(usage(r))),'dim']])},
 spans:r=>flat(r.spans).slice(0,9).map(x=>[x.s[0].padEnd(34,' ')+' '+String(x.s[3]).padStart(6,' ')+'ms','pri']),
 logs:r=>{const by={};r.logs.forEach(l=>by[l[1]]=(by[l[1]]||0)+1);
  return[[Object.keys(by).map(k=>k+' '+by[k]).join(' · '),'pri'],['stream: AgentEvent · replay from run record','dim']]},
 clear:()=>[]};

function select(i){
 state.i=i;state.sel=null;if(tick){clearInterval(tick);tick=null}
 const run=RUNS[i];
 renderTabs();pulse(run);renderTraces(run);renderMetrics(run);renderLogs(run);termAttach(run);
 if(run.status==='running'){tk=0;tick=setInterval(()=>{liveTick(run)},2600)}}

function liveTick(run){
 tk++;const l=LIVE[tk%LIVE.length],ms=run.dur+tk*2600;
 if(!state.sel||state.sel===l[1]){
  const d=document.createElement('div');d.innerHTML=logRow([ms,l[0],l[1],l[2]],state.sel===l[1]);
  $('logList').appendChild(d.firstChild);$('logList').scrollTop=1e9;
  $('logMeta').textContent=(parseInt($('logMeta').textContent,10)+1)+' / '+(run.logs.length+tk)+' lines'}
 if(cur){const tb=cur.sr.tok.reduce((a,b)=>a+b,0)/cur.sr.tok.length;
  cur.sr.tok.push(tb*(0.85+0.3*Math.random()));cur.sr.tok.shift();
  const ub=cur.sr.usd.reduce((a,b)=>a+b,0)/cur.sr.usd.length;
  cur.sr.usd.push(ub*(0.85+0.3*Math.random()));cur.sr.usd.shift();updateChart()}
 $('pulseTxt').textContent='LIVE · '+S(run.dur+tk*2600)}

$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)select(+b.dataset.i)});
$('traceList').addEventListener('click',e=>{const b=e.target.closest('.span');if(b)pickSpan(b.dataset.n)});
$('traceList').addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const b=e.target.closest('.span');if(b){e.preventDefault();pickSpan(b.dataset.n)}});
function pickSpan(n){const run=RUNS[state.i];state.sel=state.sel===n?null:n;
 renderTraces(run);renderLogs(run);drawChart(run,true)}

$('logFilter').addEventListener('click',()=>{state.sel=null;const run=RUNS[state.i];renderTraces(run);renderLogs(run);drawChart(run,true)});

const chartBox=document.querySelector('.chartbox');
chartBox.addEventListener('mousemove',e=>{
 if(!cur)return;const r=$('chart').getBoundingClientRect(),sr=cur.sr,N=sr.tok.length;
 const fx=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),i=Math.round(fx*(N-1));
 const xh=$('chart').querySelector('.xh'),W=640,H=176;
 const mx=Math.max(...sr.tok)*1.15,mu=Math.max(...sr.usd)*1.18;
 const yt=H-4-sr.tok[i]/mx*(H-16),yu=H-4-sr.usd[i]/mu*(H-16),xx=i/(N-1)*W;
 xh.style.display='block';
 xh.querySelector('line').setAttribute('x1',xx);xh.querySelector('line').setAttribute('x2',xx);
 const ct=xh.querySelector('.ct'),cu=xh.querySelector('.cu');
 ct.setAttribute('cx',xx);ct.setAttribute('cy',yt);cu.setAttribute('cx',xx);cu.setAttribute('cy',yu);
 const tip=$('tip');tip.style.display='block';
 tip.textContent='t '+((i+.5)*sr.dt/1000).toFixed(1)+'s · '+K(sr.tok[i])+' tok/s · '+USD(sr.usd[i])+'/s';
 tip.style.left=Math.min(76,Math.max(2,fx*100))+'%'});
chartBox.addEventListener('mouseleave',()=>{const xh=$('chart').querySelector('.xh');if(xh)xh.style.display='none';$('tip').style.display='none'});

$('drawerToggle').addEventListener('click',()=>{
 const f=$('drawer'),min=f.classList.toggle('min');
 $('drawerToggle').setAttribute('aria-expanded',String(!min));
 $('drawerToggle').setAttribute('aria-label',min?'expand terminal':'collapse terminal')});
document.querySelector('.inrow').addEventListener('click',()=>$('termIn').focus());
$('termIn').addEventListener('keydown',e=>{
 if(e.key!=='Enter')return;const v=$('termIn').value;$('termIn').value='';
 termPrint(promptOf(RUNS[state.i])+' '+v,'pri');
 const w=v.trim().split(/\s+/)[0];
 if(!w)return;
 const fn=CMDS[w];
 if(!fn){termPrint('harness: command not found: '+w+' · try \'help\'','err');return}
 for(const line of fn(RUNS[state.i]))termPrint(line[0],line[1])});

$('totalCost').textContent='$'+RUNS.reduce((a,r)=>a+costOf(usage(r)),0).toFixed(2);
termPrint('agentic-coding-harness pty · recorded stream replay (mock)','dim');
termPrint('try: status · tokens · cost · spans · logs · clear','dim');
select((()=>{const q=new URLSearchParams(location.search).get('run');const i=RUNS.findIndex(r=>r.agent===q);return i>=0?i:0})());
$('termIn').focus();
</script>
</body>
