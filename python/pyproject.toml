[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-coding-harness"
version = "0.10.1"
description = "Run, watch, and meter Claude Code, Codex CLI, Gemini CLI, OpenCode, and Kiro from one CLI — verified cost tracking, token usage, budget caps, OTel gen_ai spans, Langfuse traces, and a live dashboard + MCP server."
keywords = ["claude-code", "codex-cli", "gemini-cli", "opencode", "kiro", "coding-agent", "agent-observability", "cost-tracking", "token-usage", "opentelemetry", "langfuse", "mcp-server", "llm", "ai-agents", "cli"]
authors = [{ name = "Stephen Blatt" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/sblattj/agentic-coding-harness"
Repository = "https://github.com/sblattj/agentic-coding-harness"
Issues = "https://github.com/sblattj/agentic-coding-harness/issues"

[project.scripts]
ach = "agentic_coding_harness._cli:main"
agentic-coding-harness = "agentic_coding_harness._cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_coding_harness"]
artifacts = ["src/agentic_coding_harness/_vendor/ach.mjs"]

[tool.hatch.build.targets.sdist]
include = [
    "src/agentic_coding_harness",
    "tests",
    "README.md",
    "pyproject.toml",
]
artifacts = ["src/agentic_coding_harness/_vendor/ach.mjs"]
